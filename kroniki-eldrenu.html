  const hpP = Math.max(0,state.hp)/totalMaxHp()*100, hpM = Math.max(0,m.hp)/m.maxHp*100;
  layer.innerHTML =
    '<div class="bt-arena">'+
      '<div class="bt-side"><div class="bt-stage'+(b.pHit?' hit':'')+'">'+creatureArt('hero','hero',{})+'</div>'+
        '<div class="plate">'+state.name+' • '+state.level+'</div>'+
        '<div class="hbar bt-hp"><i class="hp" style="width:'+hpP+'%"></i></div>'+
        '<div class="hrow">'+Math.max(0,state.hp)+' / '+totalMaxHp()+'</div></div>'+
      '<div class="vs">VS</div>'+
      '<div class="bt-side"><div class="bt-stage'+(b.mHit?' hit':'')+'">'+creatureArt(m.key,m.shape,m.p)+'</div>'+
        '<div class="plate">'+m.name+(m.boss?' 👑':'')+' • '+m.level+'</div>'+
        '<div class="hbar bt-hp"><i class="hp" style="width:'+hpM+'%"></i></div>'+
        '<div class="hrow">'+Math.max(0,m.hp)+' / '+m.maxHp+'</div></div>'+
    '</div>'+
    '<div class="bt-log-wrap"><div class="bt-log-head"><b>'+arenaName+'</b>'+
      '<button class="flee" data-action="flee">Wycofaj się</button></div>'+
      '<div class="bt-log">'+b.log.map(l=>'<div>'+l+'</div>').join('')+'</div></div>';
}

/* ---------- HUD ---------- */
function fmtT(sec){ sec=Math.max(0,Math.ceil(sec)); const m=Math.floor(sec/60), s=sec%60; return m+':'+(s<10?'0':'')+s; }
function renderHud(){
  regenEnergy();
  if(state.dungeon){
    document.getElementById('hud-tl').innerHTML = '';
    document.getElementById('hud-tr').innerHTML = '';
    document.getElementById('hud-bottom').innerHTML = '';
    renderQuests(); hideTip();
    return;
  }
  const max = maxEnergy(), per = regenSeconds();
  const toNext = state.energy>=max ? 0 : per - ((Date.now()-state.lastRegen)/1000 % per);
  document.getElementById('hud-tl').innerHTML =
    '<div class="hud-av">'+creatureArt('hero','hero',{})+'</div>'+
    '<div class="hud-st"><div class="hud-name">'+state.name+' • Poz. '+state.level+'</div>'+
      '<div class="hrow">❤<div class="hbar"><i class="hp" style="width:'+(Math.max(0,state.hp)/totalMaxHp()*100)+'%"></i></div>'+Math.max(0,state.hp)+'</div>'+
      '<div class="hrow">⚡<div class="hbar"><i class="en" style="width:'+(state.energy/max*100)+'%"></i></div>'+state.energy+'/'+max+'</div>'+
      '<div class="hrow">✦<div class="hbar"><i class="xp" style="width:'+(state.exp/expToNext(state.level)*100)+'%"></i></div>'+
        (toNext>0?'+1⚡ '+fmtT(toNext):'pełna')+'</div>'+
    '</div>';
  const pts = state.points||0;
  const readyQ = state.daily ? state.daily.quests.filter(q=>!q.claimed && q.prog>=q.target).length : 0;
  function badge(n, color){
    return n ? '<span style="position:absolute;top:-5px;right:-5px;background:'+(color||'var(--danger)')+';color:#fff;border-radius:50%;min-width:20px;height:20px;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #2a1e13">'+n+'</span>' : '';
  }
  document.getElementById('hud-tr').innerHTML =
    '<div class="res-row">'+
      '<div class="res gold" '+resTip('gold')+'><span class="coin"></span>'+state.gold+'</div>'+
      '<div class="res" style="color:#e0b070" '+resTip('wood')+'>🪵'+state.res.wood+'</div>'+
      '<div class="res" style="color:#ccd2d8" '+resTip('stone')+'>🪨'+state.res.stone+'</div>'+
      '<div class="res gem" '+resTip('gems')+'>💎'+state.gems+'</div></div>'+
    '<div class="res-row">'+
      '<div class="res" style="color:#c48ef5" '+resTip('shard')+'>🔮'+(state.res.shard||0)+'</div>'+
      '<div class="res" style="color:#ffce54" '+resTip('keys')+'>🗝️'+(state.keys||0)+'</div>'+
    '</div>'+
    '<div class="icon-row">'+
      '<button class="ibtn" data-action="panel" data-id="character" title="Postać" style="position:relative">🧙'+badge(pts)+'</button>'+
      '<button class="ibtn" data-action="panel" data-id="inventory" title="Ekwipunek">🎒</button>'+
      '<button class="ibtn" data-action="panel" data-id="relics" title="Relikty">🔮</button>'+
      '<button class="ibtn" data-action="panel" data-id="achievements" title="Osiągnięcia">🏆</button>'+
      '<button class="ibtn" data-action="quests" title="Zadania dzienne" style="position:relative">📜'+badge(readyQ,'var(--ok)')+'</button>'+
      '<button class="ibtn dim" data-action="settings" title="Ustawienia">⚙️</button>'+
    '</div>';
  const bottom = document.getElementById('hud-bottom');
  if(state.battle || state.dungeon){ bottom.innerHTML = ''; renderQuests(); hideTip(); return; }
  const prevGrid = bottom.querySelector('.bag-grid');
  const prevScroll = prevGrid ? prevGrid.scrollTop : 0;
  const onCastle = state.screen === 'castle';
  bottom.innerHTML =
    '<button class="nav-btn'+(onCastle?'':' castle')+'" data-action="nav">'+
      '<span class="ic">'+(onCastle?'🗺️':'🏰')+'</span><span class="lb">'+(onCastle?'ŚWIAT':'ZAMEK')+'</span></button>'+
    renderDock();
  const grid = bottom.querySelector('.bag-grid');
  if(grid && prevScroll) grid.scrollTop = prevScroll;
  /* keep the sidebar clear of the hero card, whatever height it ends up */
  const card = document.getElementById('hud-tl'), dock = bottom.querySelector('.dock');
  if(card && dock && window.innerWidth > 760){
    const top = card.getBoundingClientRect().bottom + 12;
    dock.style.top = top+'px';
    dock.style.maxHeight = 'calc(100vh - '+(top+24)+'px)';
  }
  renderQuests();
}

/* ---------- widget zadań dziennych ---------- */
function renderQuests(){
  const box = document.getElementById('hud-quests');
  if(!box) return;
  if(state.battle || state.dungeon){ box.innerHTML = ''; return; }
  const d = ensureDaily();
  const open = state.questsOpen !== false;
  const ready = d.quests.filter(q=>!q.claimed && q.prog>=q.target).length;
  let h = '<div class="quests'+(open?'':' min')+'"><div class="q-head"><b>📜 Zadania dzienne</b>'+
    (ready && open ? '<span class="q-badge">'+ready+'</span>' : '')+
    '<button class="dock-tog" data-action="quests" title="'+(open?'Ukryj':'Pokaż')+'">'+(open?'▾':'▸')+'</button></div>';
  if(open){
    h += '<div class="q-body">';
    d.quests.forEach(function(q){
      const def = dailyDef(q.id); if(!def) return;
      const done = q.prog >= q.target;
      h += '<div class="q-item'+(done?' done':'')+(q.claimed?' claimed':'')+'">'+
        '<div class="q-top"><span class="qi">'+def.icon+'</span>'+def.name+'</div>'+
        '<div class="q-desc">'+def.desc(q.target)+'</div>'+
        '<div class="bar-lg" style="height:8px"><i style="width:'+Math.min(100,q.prog/q.target*100)+'%"></i></div>'+
        '<div class="q-foot"><span>'+Math.min(q.prog,q.target)+' / '+q.target+'</span>'+
        (q.claimed ? '<span style="color:var(--ok);font-weight:800">✓ odebrane</span>'
          : '<button class="btn sm" data-action="claimquest" data-id="'+q.id+'" '+(done?'':'disabled')+'>Skrzynia</button>')+
        '</div></div>';
    });
    h += '</div>';
    h += '<div class="q-chest"><span>🎁 Skrzynie: <b style="color:var(--gold)">'+(state.chests||0)+'</b></span>'+
      '<button class="btn sm" data-action="openchest" '+((state.chests||0)>0?'':'disabled')+'>Otwórz</button></div>';
    if(!d.bonus) h += '<div class="q-desc" style="margin:6px 0 0">Komplet 3 zadań = 2 dodatkowe skrzynie.</div>';
  }
  box.innerHTML = h+'</div>';
}

/* ---------- equipment dock ---------- */

  }
  const r = rarityInfo(it.rarity);
  return '<div class="cell'+(kind==='eq'?' eqslot':'')+'" style="border-color:'+r.color+';background:'+r.color+'22" '+
    'data-tip="'+(kind==='eq'?'eq:'+key:'bag:'+it.id)+'">'+itemIcon(it, kind==='eq'?34:30)+
    (it.upg?'<span class="up">+'+it.upg+'</span>':'')+'</div>';
}

/* ---------- item tooltip ---------- */
let tipHideT = null;
function hideTip(){ const t = document.getElementById('tip'); if(t) t.remove(); }
function showTip(ref, kind, key){
  const cur = document.getElementById('tip');
  if(cur && cur.dataset.key === kind+':'+key) return;
  hideTip();
  if(kind === 'res'){
    const r = RES[key]; if(!r) return;
    const have = key==='gold' ? state.gold : key==='gems' ? state.gems :
                 key==='keys' ? (state.keys||0) :
                 key==='energy' ? state.energy+' / '+maxEnergy() : (state.res[key]||0);
    const el = document.createElement('div');
    el.id = 'tip'; el.dataset.key = kind+':'+key;
    el.innerHTML = '<h4 style="color:'+r.color+'">'+r.icon+' '+r.name+'</h4>'+
      '<div class="tstat" style="margin-top:4px">'+r.desc+'</div>'+
      '<div class="tstat" style="margin-top:7px">Posiadasz: <b style="color:'+r.color+'">'+have+'</b></div>';
    document.body.appendChild(el);
    placeTip(el, ref);
    return;
  }
  const it = kind==='eq' ? state.equipment[key] : state.inventory.find(x=>x.id===key);
  if(!it) return;
  const r = rarityInfo(it.rarity), b = SLOT_BASE[it.slot];
  /* przedmiot z torby zestawiamy z tym, co siedzi w jego slocie */
  const worn = kind === 'bag' ? state.equipment[it.slot] : null;
  const cmp = !!(worn && worn.id !== it.id);
  const lines = STAT_KEYS.filter(function(k){ return it[k] || (cmp && worn[k]); }).map(function(k){
    const m = STAT_META[k], nv = it[k] ? effStat(it,k) : 0;
    let row = '<span>'+m.ic+' '+m.name+' <b>'+(nv ? '+'+nv+m.suf : '—')+'</b></span>';
    if(cmp){
      const d = nv - (worn[k] ? effStat(worn,k) : 0);
      const col = d > 0 ? 'var(--ok)' : d < 0 ? '#e0524a' : 'var(--text-faint)';
      row += '<span style="color:'+col+';font-weight:800;white-space:nowrap">'+
        (d > 0 ? '▲ +'+d : d < 0 ? '▼ '+d : '=')+'</span>';
    }
    return '<div class="tstat-row">'+row+'</div>';
  });
  let cmpHTML = '';
  if(kind === 'bag'){
    if(cmp){
      const wr = rarityInfo(worn.rarity), ds = itemScore(it) - itemScore(worn);
      const verdict = ds > 0 ? {t:'Lepszy od założonego', c:'var(--ok)'}
                    : ds < 0 ? {t:'Słabszy od założonego', c:'#e0524a'}
                    : {t:'Porównywalny', c:'var(--text-dim)'};
      cmpHTML = '<div class="tcmp"><div class="tcmp-h">Porównanie — '+b.label.toLowerCase()+'</div>'+
        '<div class="tcmp-row">'+itemIcon(worn,22)+'<span style="color:'+wr.color+'">'+itemName(worn)+'</span></div>'+
        '<div class="tcmp-v" style="color:'+verdict.c+'">'+verdict.t+
        (ds ? ' ('+(ds>0?'+':'')+ds+' mocy)' : '')+'</div></div>';
    } else {
      cmpHTML = '<div class="tcmp"><div class="tcmp-v" style="color:var(--ok)">'+
        SLOT_BASE[it.slot].icon+' Slot „'+b.label+'" jest pusty — każdy bonus to czysty zysk.</div></div>';
    }
  }
  const el = document.createElement('div');
  el.id = 'tip';
  el.dataset.key = kind+':'+key;
  el.innerHTML = '<h4 style="color:'+r.color+';display:flex;align-items:center;gap:7px">'+itemIcon(it,26)+itemName(it)+'</h4>'+
    '<span class="trar" style="background:'+r.color+'33;color:'+r.color+'">'+r.label+' • '+b.label+' • poz. '+it.tier+'</span>'+
    '<div class="tstat">'+lines.join('')+'</div>'+
    cmpHTML+
    (it.flavor ? '<div class="tstat" style="margin-top:7px;font-style:italic;color:#ffb98a">„'+it.flavor+'"</div>' : '')+
    (kind==='eq'
      ? '<div class="trow"><button class="btn sec sm" data-action="unequip" data-id="'+key+'">Zdejmij</button></div>'
      : '<div class="trow"><button class="btn sm" data-action="equip" data-id="'+it.id+'">Załóż</button>'+
        '<button class="btn sec sm" data-action="sell" data-id="'+it.id+'">'+sellPrice(it)+' zł</button></div>');
  document.body.appendChild(el);
  placeTip(el, ref);
}
function placeTip(el, ref){
  const rect = ref.getBoundingClientRect(), tr = el.getBoundingClientRect();
  let left = rect.left + rect.width/2 - tr.width/2;
  let top = rect.top - tr.height - 10;
  if(top < 8) top = rect.bottom + 10;
  left = Math.max(8, Math.min(left, window.innerWidth - tr.width - 8));
  top = Math.max(8, Math.min(top, window.innerHeight - tr.height - 8));
  el.style.left = left+'px'; el.style.top = top+'px';
}

function initTips(){
  document.addEventListener('pointerover', function(e){
    if(e.pointerType && e.pointerType !== 'mouse') return;
    if(!e.target.closest) return;
    if(e.target.closest('#tip')){ clearTimeout(tipHideT); return; }
    const ref = e.target.closest('[data-tip]');
    if(!ref) return;
    clearTimeout(tipHideT);
    const p = ref.dataset.tip.split(':');
    showTip(ref, p[0], p[1]);
  });
  document.addEventListener('pointerout', function(e){
    if(e.pointerType && e.pointerType !== 'mouse') return;
    if(!e.target.closest || !e.target.closest('[data-tip], #tip')) return;
    clearTimeout(tipHideT);
    tipHideT = setTimeout(hideTip, 200);
  });
}

/* ---------- pan & zoom ---------- */
const view = {castle:{x:0,y:0,k:1}, world:{x:0,y:0,k:1}};
let dragged = false;
function stageEl(){
  const l = document.getElementById(state.screen==='castle' ? 'layer-castle' : 'layer-world');
  return l && !l.hidden ? l.querySelector('.iso-stage') : null;
}
function applyView(){
  const st = stageEl(); if(!st) return;
  const v = view[state.screen];
  st.style.transform = 'translate('+v.x+'px,'+v.y+'px) scale('+v.k+')';
}
function initPanZoom(){
  const pts = new Map();
  let start = null, startView = null, startDist = 0, startK = 1, moved = 0;
  function inStage(t){ const st = stageEl(); return st && st.contains(t); }
  document.addEventListener('pointerdown', function(e){
    if(state.battle || state.dungeon || state.openPanel || !inStage(e.target)) return;
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pts.size === 1){
      const v = view[state.screen];
      start = {x:e.clientX, y:e.clientY}; startView = {x:v.x, y:v.y}; moved = 0;
    } else if(pts.size === 2){
      const a = Array.from(pts.values());
      startDist = Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y);
      startK = view[state.screen].k;
    }
  });
  document.addEventListener('pointermove', function(e){
    if(!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    const v = view[state.screen];
    if(pts.size >= 2){
      const a = Array.from(pts.values());
      const d = Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y);
      if(startDist > 0){ v.k = Math.min(2.6, Math.max(0.5, startK*(d/startDist))); applyView(); }
      moved = 99;
    } else if(start){
      v.x = startView.x + (e.clientX - start.x);
      v.y = startView.y + (e.clientY - start.y);
      moved = Math.max(moved, Math.abs(e.clientX-start.x) + Math.abs(e.clientY-start.y));
      applyView();
    }
  });
  function up(e){
    if(!pts.has(e.pointerId)) return;
    pts.delete(e.pointerId);
    if(pts.size === 0){ dragged = moved > 8; start = null; setTimeout(()=>{ dragged = false; }, 120); }
  }
  document.addEventListener('pointerup', up);
  document.addEventListener('pointercancel', up);
  document.addEventListener('wheel', function(e){
    if(state.battle || state.dungeon || state.openPanel || !inStage(e.target)) return;
    e.preventDefault();
    const v = view[state.screen];
    v.k = Math.min(2.6, Math.max(0.5, v.k * (e.deltaY < 0 ? 1.12 : 0.89)));
    applyView();
  }, {passive:false});
  if(window.innerWidth < 620){ view.castle.k = 1.5; view.world.k = 1.25; }
}

    '<p class="muted" style="margin:9px 0 0">Każde osiągnięcie ma kilka poziomów — po zdobyciu jednego od razu rusza kolejny, '+
    'a nagrody rosną wraz z poziomem. Trafiają do Ciebie automatycznie.</p></div><div class="card">';
  ACHIEVEMENTS.slice().sort(function(a,b){
    const fa = achLevel(a.id) >= a.tiers.length, fb = achLevel(b.id) >= b.tiers.length;
    return (fa?1:0)-(fb?1:0);
  }).forEach(function(a){
    const lvl = achLevel(a.id), full = lvl >= a.tiers.length;
    const target = achTarget(a, lvl);
    const cur = Math.max(0, Math.min(target, a.get(state)));
    const rw = achReward(Math.min(lvl+1, a.tiers.length));
    h += '<div class="ach'+(full?' done':'')+'"><div class="achk">'+(full?'✓':a.icon)+'</div>'+
      '<div style="flex:1;min-width:0"><div class="between">'+
        '<div style="font-size:13.5px;font-weight:700">'+a.name+' '+(lvl?'<span style="color:var(--gold)">'+toRoman(lvl)+'</span>':'')+'</div>'+
        '<div class="muted" style="font-size:11.5px;white-space:nowrap">'+(full?'MAKS':cur+' / '+target)+'</div></div>'+
      '<div class="muted" style="font-size:12px">'+(full?'Wszystkie '+a.tiers.length+' poziomów zdobyte.':a.desc(target))+'</div>'+
      '<div class="bar-lg"><i style="width:'+(full?100:(cur/target*100))+'%"></i></div>'+
      (full?'' : '<div class="ach-rw">Za poziom '+toRoman(lvl+1)+': '+rw.gold+' złota • '+rw.gems+' 💎 • '+rw.exp+' exp</div>')+
      '</div></div>';
  });
  return h+'</div>';
}
function buildingPreview(id, lvl){

function pBuilding(id){
  const def = BUILDINGS[id], lvl = bLvl(id), next = lvl+1;
  const maxed = next > def.max;
  const capped = id!=='keep' && next > bLvl('keep');
  const cost = maxed ? null : bcostFull(id, next);
  let h = '<div class="card"><div class="row" style="align-items:flex-start">'+
    '<div class="bpreview">'+buildingPreview(id, lvl)+'</div>'+
    '<div style="flex:1;min-width:0"><div style="font-weight:800;font-size:15px">'+def.icon+' '+def.name+'</div>'+
    '<div class="muted">'+(lvl>0?'Poziom '+lvl:'Jeszcze nie wybudowano')+'</div>'+
    '<p class="muted" style="margin:7px 0 0">'+def.desc+'</p></div></div>';
  if(lvl>0) h += '<div class="card" style="margin:11px 0 0;background:rgba(255,206,84,.08)"><b style="font-size:13px">Teraz:</b> '+def.effect(lvl)+'</div>';
  if(!maxed) h += '<div class="card" style="margin:9px 0 0"><b style="font-size:13px;color:var(--ok)">Po ulepszeniu (poz. '+next+'):</b> '+def.effect(next)+'</div>';
  h += '<div class="between" style="margin-top:12px">'+
    '<span class="muted">'+(maxed?'Poziom maksymalny':'Koszt: '+costHTML(cost))+'</span>'+
    (maxed?'':'<button class="btn" data-action="build" data-id="'+id+'" '+((!canAfford(cost)||capped)?'disabled':'')+'>'+(lvl>0?'Ulepsz':'Wybuduj')+'</button>')+
    '</div>';
  if(capped) h += '<p class="muted" style="margin:8px 0 0;color:#f0b23e">Wymaga Zamku na poziomie '+next+'.</p>';
  h += '</div>';

  if(id==='mine' && lvl>0){
    const p = minePending();
    h += '<div class="card"><h3>Urobek</h3><div class="between">'+
      '<div><div style="font-size:19px;font-weight:800;color:var(--gold)">'+p+' złota</div>'+
      '<div class="muted">magazyn '+mineCap(lvl)+' • '+mineRate(lvl)+'/h</div></div>'+
      '<button class="btn" data-action="collect" '+(p<=0?'disabled':'')+'>Odbierz</button></div></div>';
  }
  if(id==='sawmill' && lvl>0){
    const w = sawPending('wood'), s = sawPending('stone');
    h += '<div class="card"><h3>Produkcja</h3><div class="between">'+
      '<div><div style="font-size:18px;font-weight:800;color:var(--gold)">'+resTag('wood',w)+' &nbsp; '+resTag('stone',s)+'</div>'+
      '<div class="muted">magazyn '+sawCap(lvl)+' • '+sawRate(lvl,'wood')+'/h drewna, '+sawRate(lvl,'stone')+'/h kamienia</div></div>'+
      '<button class="btn" data-action="collectsaw" '+((w+s)<=0?'disabled':'')+'>Odbierz</button></div>'+
      '<p class="muted" style="margin:9px 0 0">Większe ilości surowców zdobędziesz w złożach na mapie świata.</p></div>';
  }
  if(id==='forge' && lvl>0){
    h += '<div class="card"><h3>Ulepszanie przedmiotów</h3>';
    let any = false;
    SLOT_KEYS.forEach(slot=>{
      const it = state.equipment[slot]; if(!it) return;
      any = true;
      const r = rarityInfo(it.rarity), atMax = (it.upg||0) >= lvl, c = forgeCost(it);
      h += '<div class="shoprow"><div style="min-width:0"><div style="color:'+r.color+';font-weight:700;font-size:13.5px">'+itemName(it)+'</div>'+
        '<div class="muted">'+itemStats(it)+' • '+(atMax?'maks. dla poz. '+lvl:'koszt '+c+' zł')+'</div></div>'+
        '<button class="btn sm" data-action="forge" data-id="'+slot+'" '+((atMax||state.gold<c)?'disabled':'')+'>+1</button></div>';
    });
    if(!any) h += '<p class="muted">Załóż jakiś przedmiot, by go ulepszyć.</p>';
    h += '</div>';
  }
  if(id==='market' && lvl>0){
    h += '<div class="card"><h3>Oferta za kryształy 💎 '+state.gems+'</h3>';
    marketOffers().forEach(o=>{
      h += '<div class="shoprow"><div style="min-width:0"><div style="font-weight:700;font-size:13.5px">'+o.name+'</div>'+
        '<div class="muted">'+o.desc+'</div></div>'+
        '<button class="btn sm" data-action="buy" data-id="'+o.id+'" '+(state.gems<o.cost?'disabled':'')+'>'+o.cost+' 💎</button></div>';
    });
    h += '<p class="muted" style="margin:9px 0 0">Kryształy zdobywasz za bossów, Wędrownego Herosa, poziomy osiągnięć i skrzynie z zadań dziennych.</p></div>';
  }
  return h;
}
const PANEL_TITLES = {character:'Postać', inventory:'Ekwipunek', achievements:'Osiągnięcia', relics:'Relikty'};
function renderPanel(){
  const layer = document.getElementById('layer-panel');
  if(!state.openPanel){ layer.hidden = true; layer.innerHTML = ''; return; }
  let title = '', sub = '', body = '';
  if(state.openPanel === 'building'){
    const def = BUILDINGS[state.panelArg];
    title = def.icon+' '+def.name; sub = 'Posiadłość • Eldren';
    body = pBuilding(state.panelArg);
  } else if(state.openPanel === 'zone'){
    const z = ZONES.find(x=>x.id===state.panelArg);
    title = z.name; sub = 'Wybierz przeciwnika';
    body = pZone(state.panelArg);
  } else if(state.openPanel === 'node'){
    const nd = NODES.find(x=>x.id===state.panelArg);
    title = nd.icon+' '+nd.name; sub = 'Złoże surowców • Eldren';
    body = pNode(state.panelArg);
  } else {
    title = PANEL_TITLES[state.openPanel] || '';
    body = state.openPanel==='character' ? pCharacter()
         : state.openPanel==='inventory' ? pInventory()
         : state.openPanel==='relics' ? pRelics()
         : pAchievements();
  }
  layer.hidden = false;
  layer.innerHTML = '<div class="pcard"><button class="pclose" data-action="closepanel">✕</button>'+
    '<h2 class="ptitle display">'+title+'</h2>'+(sub?'<p class="psub">'+sub+'</p>':'')+body+'</div>';
}

function modal(html){
  const bg = document.createElement('div'); bg.className = 'mbg';
  bg.innerHTML = '<div class="modal">'+html+'</div>';
  document.body.appendChild(bg);
  bg.addEventListener('click', e=>{ if(e.target===bg) bg.remove(); });
  return bg;
}

      '(×'+(1+(dg.tier-1)*0.35).toFixed(2)+'). Uważaj na 👻 zjawy: kradną czas i odłamki.</p>'+
      '<div class="between" style="margin-top:11px"><span class="muted">'+(keys>0?'Koszt wejścia: 1 🗝️ klucz':'Brak klucza — zdobądź go ze skrzyń za zadania dzienne')+'</span>'+

function backToPicker(loot){
  if(loot.hero){ return; }
  if(loot.guard){ state.openPanel = 'node'; state.panelArg = loot.guard; }
  else if(loot.zoneId){ state.openPanel = 'zone'; state.panelArg = loot.zoneId; }
  renderPanel();
}
function retryBtnHTML(loot){
  if(loot.hero){
    if(!state.heroSpawn || !state.heroSpawn.alive) return '';
    return '<button class="btn" id="again" '+(state.energy<heroCost()?'disabled':'')+'>Walcz ponownie ('+heroCost()+'⚡)</button>';
  }
  if(loot.guard){
    const cost = guardCost(nodeState(loot.guard).lvl || 0);
    return '<button class="btn" id="again" '+(state.energy<cost?'disabled':'')+'>Atakuj ponownie ('+cost+'⚡)</button>';
  }
  const z = ZONES.find(x=>x.id===loot.zoneId);
  if(!z || loot.stageIdx == null) return '';
  const st = stageList(z)[loot.stageIdx];
  return '<button class="btn" id="again" '+(state.energy<st.cost?'disabled':'')+'>Walcz ponownie ('+st.cost+'⚡)</button>';
}
function wireLoot(d, loot){
  const close = d.querySelector('[data-close]');
  if(close) close.onclick = ()=>{ d.remove(); backToPicker(loot); render(); };
  const again = d.querySelector('#again');
  if(again) again.onclick = ()=>{
    d.remove();
    if(loot.hero) fightHero();
    else if(loot.guard) fightGuardian(loot.guard);
    else startExplore(loot.zoneId, loot.stageIdx);
  };
}

    '<button class="btn" id="goHero" '+(state.energy<cost?'disabled':'')+'>Do walki!</button></div>');
  d.querySelector('[data-close]').onclick = ()=>d.remove();
  d.querySelector('#goHero').onclick = ()=>{ d.remove(); fightHero(); };
}
function showSoonModal(id){
  const d = SOON[id];
  const bg = modal('<h3 class="display">'+d.icon+' '+d.name+'</h3><p>'+d.desc+'</p>'+
    '<p class="muted" style="font-size:12.5px">Plac jest już zarezerwowany — budynek pojawi się w kolejnej aktualizacji.</p>'+
    '<div class="row"><button class="btn" data-close="1">Rozumiem</button></div>');
  bg.querySelector('[data-close]').onclick = ()=>bg.remove();
}
function showSettings(){
  const bg = modal('<h3 class="display">Ustawienia</h3>'+
    '<p>Imię bohatera</p>'+
    '<input id="heroName" value="'+state.name.replace(/"/g,'')+'" maxlength="14" '+
      'style="width:100%;padding:9px 11px;border-radius:10px;border:2px solid #6b4f33;background:rgba(0,0,0,.35);color:#fff6e2;font-family:inherit;font-size:14px"/>'+
    '<p class="muted" style="font-size:12px;margin-top:10px">Postęp zapisuje się w tej przeglądarce.</p>'+
    '<div class="row"><button class="btn sec" data-close="1">Zamknij</button>'+
    '<button class="btn" id="saveName">Zapisz</button></div>'+
    '<div class="row"><button class="btn dgr" id="resetGame">Nowa gra</button></div>');
  bg.querySelector('[data-close]').onclick = ()=>bg.remove();
  bg.querySelector('#saveName').onclick = ()=>{
    const v = (bg.querySelector('#heroName').value||'').trim();
    if(v) { state.name = v.slice(0,14); saveState(); render(); }
    bg.remove();
  };
  bg.querySelector('#resetGame').onclick = ()=>{
    bg.remove();
    const c = modal('<h3 class="display" style="color:var(--danger)">Na pewno?</h3>'+
      '<p>Cały postęp — posiadłość, przedmioty i poziomy — zostanie usunięty.</p>'+
      '<div class="row"><button class="btn sec" data-close="1">Anuluj</button>'+
      '<button class="btn dgr" id="yes">Usuń postęp</button></div>');
    c.querySelector('[data-close]').onclick = ()=>c.remove();
    c.querySelector('#yes').onclick = ()=>{
      if(battleTimer){ clearInterval(battleTimer); battleTimer = null; }
      state = defaultState(); saveState(); c.remove(); render();
    };
  };
}

/* =====================================================================
   9. MAIN RENDER + EVENTS + BOOT
===================================================================== */
function render(){
  const c = document.getElementById('layer-castle'), w = document.getElementById('layer-world');
  const onCastle = state.screen === 'castle';
  const inDg = !!state.dungeon;
  c.hidden = !onCastle || inDg; w.hidden = onCastle || inDg;
  if(!inDg){ if(onCastle) renderCastle(); else renderWorld(); }
  renderBattle(); renderDungeon(); renderHud(); renderPanel();
  applyView();
}
document.addEventListener('keydown', function(e){
  if(e.key !== 'Escape') return;
  if(state.dungeon){ quitDungeon(); return; }
  const m = document.querySelector('.mbg');
  if(m){ m.remove(); return; }
  if(document.getElementById('tip')){ hideTip(); return; }
  if(state.openPanel){ state.openPanel = null; renderPanel(); }
});
document.addEventListener('click', function(e){
  if(dragged) return;
  /* click outside an open tooltip closes it */
  const tipEl = document.getElementById('tip');
  if(tipEl && !tipEl.contains(e.target) && !e.target.closest('[data-tip]')) hideTip();
  /* click on the dimmed backdrop closes the panel */
  const panelLayer = document.getElementById('layer-panel');
  if(!panelLayer.hidden && e.target === panelLayer){ state.openPanel = null; renderPanel(); return; }
  const tipRef = e.target.closest('[data-tip]');
  if(tipRef){
    const parts = tipRef.dataset.tip.split(':');
    showTip(tipRef, parts[0], parts[1]);
    return;
  }
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const a = el.dataset.action, id = el.dataset.id;
  if(a==='dock'){ state.dockOpen = state.dockOpen === false; renderHud(); saveState(); return; }
  if(a==='quests'){ state.questsOpen = state.questsOpen === false; renderQuests(); saveState(); return; }
  if(a==='claimquest'){ claimQuest(id); return; }
  if(a==='openchest'){ showChestModal(); return; }
  if(a==='relicup'){ upgradeRelic(id); return; }
  if(a==='relictoggle'){ toggleRelic(id); return; }
  if(a==='resetstats'){ resetStats(); return; }
  if(a==='dungeon'){ enterDungeon(id); return; }
  if(a==='dgquit'){ quitDungeon(); return; }
  if(a==='hero'){ showHeroModal(); return; }
  if(a==='plot'){
    if(SOON[id]) showSoonModal(id);
    else { state.openPanel = 'building'; state.panelArg = id; renderPanel(); }
  }
  else if(a==='zone'){
    const z = ZONES.find(x=>x.id===id);
    if(state.level < z.unlockLevel){ toast('Odblokujesz tę krainę na poziomie '+z.unlockLevel+'.'); return; }
    state.openPanel = 'zone'; state.panelArg = id; renderPanel();
  }
  else if(a==='fight'){ startExplore(id, parseInt(el.dataset.stage,10)); }
  else if(a==='nav'){ state.screen = state.screen==='castle' ? 'world' : 'castle'; state.openPanel = null; render(); saveState(); }
  else if(a==='panel'){ state.openPanel = id; renderPanel(); }
  else if(a==='closepanel'){ state.openPanel = null; renderPanel(); }
  else if(a==='build'){ buildOrUpgrade(id); }
  else if(a==='collect'){ collectMine(false); }
  else if(a==='collectsaw'){ collectSaw(false); }
  else if(a==='node'){ state.openPanel = 'node'; state.panelArg = id; renderPanel(); }
  else if(a==='collectnode'){ collectNode(id); }
  else if(a==='guard'){ fightGuardian(id); }
  else if(a==='point'){ spendPoint(id); }
  else if(a==='forge'){ forgeUpgrade(id); }
  else if(a==='buy'){ buyOffer(id); }
  else if(a==='equip'){ hideTip(); equipItem(id); }
  else if(a==='unequip'){ hideTip(); unequipItem(id); }
  else if(a==='sell'){ sellItem(id); }
  else if(a==='sellcommons'){ sellCommons(); }
  else if(a==='flee'){ fleeBattle(); }
  else if(a==='settings'){ showSettings(); }
});

let tick = 0;
let lastEnergy = -1;
setInterval(function(){
  tick++;
  regenEnergy();
  ensureDaily();
  tickHero();
  if(!state.dungeon) renderHud();
  /* panele pokazujące energię muszą nadążać za regeneracją */
  if(state.energy !== lastEnergy){
    lastEnergy = state.energy;
    if(state.openPanel === 'zone' || state.openPanel === 'node') renderPanel();
  }
  if(tick % 6 === 0 && !state.battle && !state.dungeon){
    if(state.screen==='castle') renderCastle(); else renderWorld();
  }
  saveState();
}, 5000);

try{
  window.claude && window.claude.hot && window.claude.hot.snapshot &&
  window.claude.hot.snapshot(function(){ return {__eldren: state}; });
}catch(e){}

setInterval(function(){
  if(state.battle || state.dungeon) return;
  tickHeroClock();
}, 1000);

probeArt(function(){
  artReady = true;
  if(Object.keys(ART_OK).length) render();
});

initPanZoom();
initTips();
initDungeonControls();
ensureDaily();
tickHero();
render();
if(!state.seenIntro){
  state.seenIntro = true; saveState();
  setTimeout(()=>toast('Witaj w Eldren! Rozbuduj posiadłość i wyruszaj w świat przyciskiem 🗺️.'), 500);
}
})();
</script>

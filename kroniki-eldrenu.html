<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Kroniki Eldrenu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Baloo+2:wght@500;600;700;800&display=swap">
<style>
  :root{
    --sky-a:#9fd3ef; --sky-b:#d8eef0;
    --gold:#ffce54; --gold-2:#f0a830; --gold-dark:#a86b16;
    --wood:#8a5a34; --wood-dark:#4e3018;
    --panel:#2a1e13; --panel-2:#3a2a1a;
    --hud:rgba(26,18,10,.82);
    --text:#fff6e2; --text-dim:#d8c6a4; --text-faint:#9c8a6c;
    --hp:#e05a4a; --energy:#4fc3e0; --exp:#8bd15a;
    --danger:#c0392b; --ok:#7dbb5a;
    --rarity-common:#b6ac9c; --rarity-uncommon:#68c164; --rarity-rare:#5b9fe8;
    --rarity-epic:#b57cf0; --rarity-legendary:#f0b23e;
    --sh:rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{font-family:'Baloo 2',ui-rounded,system-ui,sans-serif;color:var(--text);background:#101820;}
  .display{font-family:'Cinzel',serif;}
  #app{position:fixed;inset:0;overflow:hidden;}
  button{font-family:inherit;border:none;cursor:pointer;}

  .layer{position:absolute;inset:0;}
  #layer-castle{background:#5f9440;}
  #layer-world{background:#4d7c3a;}
  .iso-stage{position:absolute;inset:0;display:block;transform-origin:50% 50%;touch-action:none;will-change:transform;}
  .iso-stage > svg{width:100%;height:100%;display:block;}
  .clickable{cursor:pointer;}
  .clickable:hover{filter:brightness(1.08);}
  @keyframes coinbob{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
  .coin-ready{animation:coinbob 1.4s ease-in-out infinite;}
  @keyframes pulseRing{0%,100%{opacity:.35;}50%{opacity:.9;}}
  .pulse{animation:pulseRing 1.8s ease-in-out infinite;}
  @media (prefers-reduced-motion: reduce){.coin-ready,.pulse,.bobber{animation:none !important;}}

  /* ---------- HUD ---------- */
  .hud{position:absolute;inset:0;z-index:40;pointer-events:none;}
  .hud > *{pointer-events:auto;}
  .hud-tl{position:absolute;top:12px;left:12px;display:flex;gap:11px;align-items:center;
    background:var(--hud);backdrop-filter:blur(4px);border-radius:22px;padding:9px 18px 9px 9px;
    box-shadow:0 6px 16px var(--sh),inset 0 1px 0 rgba(255,255,255,.12);max-width:min(78vw,340px);}
  .hud-av{width:62px;height:62px;flex:none;border-radius:50%;overflow:hidden;
    background:radial-gradient(circle at 40% 30%,#cfe0f5,#7f97c4);border:3px solid var(--gold);box-shadow:0 3px 8px var(--sh);}
  .hud-av svg{width:100%;height:100%;transform:scale(1.35) translateY(6%);}
  .hud-av img{width:100%;height:100%;object-fit:cover;object-position:center 14%;}
  .hud-st{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1;}
  .hud-name{font-size:15px;font-weight:800;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.2px;}
  .hbar{position:relative;height:13px;border-radius:7px;background:rgba(0,0,0,.45);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.6);}
  .hbar i{display:block;height:100%;border-radius:6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.35);}
  .hbar i.hp{background:linear-gradient(180deg,#ff8a7a,var(--hp));}
  .hbar i.en{background:linear-gradient(180deg,#8fe4f5,var(--energy));}
  .hbar i.xp{background:linear-gradient(180deg,#b6ea86,var(--exp));}
  .hrow{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-dim);}
  .hrow .hbar{flex:1;}

  .hud-tr{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;align-items:flex-end;gap:9px;}
  .res-row{display:flex;gap:8px;}
  .res{background:var(--hud);backdrop-filter:blur(4px);border-radius:17px;padding:7px 15px;display:flex;align-items:center;gap:6px;
    font-weight:800;font-size:16px;box-shadow:0 5px 12px var(--sh),inset 0 1px 0 rgba(255,255,255,.1);}
  .res.gold{color:var(--gold);} .res.gem{color:#8fe0ff;}
  .coin{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 34% 32%,#fff2b8,var(--gold-dark));box-shadow:inset 0 0 0 1px #7a4e12;}
  .icon-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:min(60vw,260px);}
  .ibtn{width:52px;height:52px;border-radius:17px;display:flex;align-items:center;justify-content:center;font-size:24px;
    background:linear-gradient(180deg,#45301c,#2a1e13);
    box-shadow:0 5px 12px var(--sh),inset 0 1px 0 rgba(255,255,255,.14);border:2px solid rgba(255,206,84,.35);}
  .ibtn:hover{border-color:var(--gold);}
  .ibtn.dim{opacity:.62;}

  .nav-btn{position:absolute;right:14px;bottom:16px;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:3px;padding:0;line-height:1;
    width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#5c8f4a,#2f5a28);
    border:3px solid var(--gold);color:var(--text);font-weight:800;font-size:13px;
    box-shadow:0 7px 18px var(--sh),inset 0 2px 0 rgba(255,255,255,.18);z-index:41;}
  .nav-btn span.ic{font-size:30px;line-height:1;display:block;height:32px;
    display:flex;align-items:center;justify-content:center;}
  .nav-btn span.lb{display:block;line-height:1;}
  .nav-btn.castle{background:radial-gradient(circle at 40% 30%,#7a6ab0,#3d3568);}

  /* ---------- CHARACTER SIDEBAR ---------- */
  .dock{position:absolute;left:12px;top:132px;max-height:calc(100vh - 156px);z-index:41;width:246px;display:flex;flex-direction:column;
    background:var(--hud);backdrop-filter:blur(4px);border-radius:20px;padding:10px 12px 12px;
    box-shadow:0 7px 18px var(--sh),inset 0 1px 0 rgba(255,255,255,.1);}
  .dock.min{width:auto;bottom:auto;padding:8px 12px;}
  .dock-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex:none;}
  .dock-head b{font-size:13.5px;color:var(--gold);}
  .dock-tog{width:32px;height:32px;border-radius:11px;background:rgba(0,0,0,.38);color:var(--text);font-size:15px;
    border:2px solid rgba(255,206,84,.4);display:flex;align-items:center;justify-content:center;flex:none;}
  .dock-body{margin-top:9px;flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:9px;padding-right:3px;}
  .dock-foot{flex:none;margin-top:9px;padding-top:9px;border-top:2px solid rgba(255,255,255,.1);}
  .sblock{background:rgba(0,0,0,.26);border-radius:13px;padding:9px 10px;}
  .sec-h{font-size:10.5px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--gold);margin-bottom:5px;}
  .srow{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:2.5px 0;color:var(--text-dim);}
  .srow b{color:var(--text);font-weight:700;}
  .attr{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;padding:3px 0;color:var(--text-dim);}
  .plus{width:23px;height:23px;border-radius:7px;background:linear-gradient(180deg,var(--gold),var(--gold-2));
    color:#3a2408;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;flex:none;}
  .plus:disabled{background:#5a5040;color:#8a8272;}
  .pts-badge{background:var(--danger);color:#fff;border-radius:9px;padding:1px 7px;font-size:11px;font-weight:800;}
  .eq-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
  .eq-doll{display:grid;grid-template-columns:repeat(3,54px);gap:7px;justify-content:center;margin-bottom:10px;}
  .eq-doll .cell.gap{border:none;background:none;box-shadow:none;cursor:default;}
  .bag-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:7px;max-height:122px;overflow-y:auto;padding-right:2px;}
  .cell{aspect-ratio:1/1;border-radius:13px;border:2px solid rgba(255,255,255,.18);background:rgba(0,0,0,.34);
    display:flex;align-items:center;justify-content:center;font-size:21px;position:relative;cursor:pointer;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08);}
  .cell:hover{filter:brightness(1.15);}
  .cell.eqslot{width:54px;height:54px;flex:none;}
  .cell.free{border-style:dashed;opacity:.45;font-size:15px;cursor:default;}
  .cell .up{position:absolute;right:3px;bottom:1px;font-size:11px;font-weight:800;color:var(--gold);text-shadow:0 1px 2px #000;}
  .cell .dot{position:absolute;top:3px;left:3px;width:8px;height:8px;border-radius:50%;}
  .bag-empty{font-size:13px;color:var(--text-faint);padding:6px 2px;}

  /* ---------- TOOLTIP ---------- */
  #tip{position:fixed;z-index:66;width:266px;background:linear-gradient(180deg,#3d2c1b,#241a10);
    border:2px solid var(--wood);border-radius:16px;padding:11px 13px;box-shadow:0 14px 30px rgba(0,0,0,.65);}
  #tip h4{margin:0;font-size:14.5px;font-weight:800;}
  #tip .trar{font-size:11px;font-weight:800;padding:2px 7px;border-radius:7px;display:inline-block;margin:5px 0 7px;}
  #tip .tstat{font-size:13.5px;color:var(--text-dim);line-height:1.6;}
  #tip .tstat-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
  #tip .tcmp{margin-top:9px;padding-top:8px;border-top:2px solid rgba(255,255,255,.12);}
  #tip .tcmp-h{font-size:10.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--text-faint);margin-bottom:5px;}
  #tip .tcmp-row{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;line-height:1.3;}
  #tip .tcmp-v{font-size:12.5px;font-weight:800;margin-top:5px;line-height:1.35;}
  #tip .trow{display:flex;gap:7px;margin-top:10px;}
  #tip .trow .btn{flex:1;text-align:center;}

  /* ---------- BATTLE ---------- */
  #layer-battle{z-index:30;display:flex;flex-direction:column;background-size:cover;background-position:center bottom;}
  /* malowane tło areny jest jasne — przyciemniamy góre i dół, żeby HUD i log zostały czytelne */
  #layer-battle.has-art::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(12,8,4,.52) 0%,rgba(12,8,4,.10) 26%,rgba(12,8,4,.12) 58%,rgba(12,8,4,.62) 100%);}
  #layer-battle.has-art > *{position:relative;}
  .bt-arena{flex:1;min-height:0;display:flex;align-items:center;justify-content:space-around;padding:96px 4vw 0;gap:8px;position:relative;}
  .bt-side{width:42%;max-width:230px;display:flex;flex-direction:column;align-items:center;gap:7px;}
  .bt-stage{width:100%;max-width:172px;aspect-ratio:1/1;position:relative;}
  .bt-stage svg.creature,.bt-stage img.creature{width:100%;height:100%;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35));}
  img.creature.art{object-fit:contain;object-position:center bottom;display:block;}
  .bt-stage.hit svg.creature,.bt-stage.hit img.creature{animation:hitf .28s;}
  @keyframes hitf{0%{filter:brightness(1);}35%{filter:brightness(2.2) saturate(.2);transform:translateX(-4px);}100%{filter:brightness(1);}}
  .plate{background:linear-gradient(180deg,#fff6e2,#e6d3ac);color:#37281a;font-weight:800;font-size:12.5px;
    padding:3px 11px;border-radius:10px;box-shadow:0 3px 6px var(--sh);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bt-hp{width:100%;}
  .vs{font-family:'Cinzel',serif;font-size:16px;color:#fff;text-shadow:0 2px 5px #000;align-self:center;}
  .bt-log-wrap{flex:none;margin:0 10px 12px;background:var(--hud);backdrop-filter:blur(4px);border-radius:16px;padding:10px 14px;
    box-shadow:0 5px 14px var(--sh),inset 0 1px 0 rgba(255,255,255,.1);}
  .bt-log-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
  .bt-log-head b{color:var(--gold);font-size:14px;}
  .bt-log{height:clamp(84px,15vh,148px);overflow-y:auto;display:flex;flex-direction:column-reverse;
    font-size:13.5px;color:var(--text-dim);overscroll-behavior:contain;}
  .bt-log div{padding:2px 0;border-bottom:1px dashed rgba(255,255,255,.08);}
  .bt-log div:first-child{color:var(--text);}
  .flee{font-size:12px;padding:6px 11px;border-radius:10px;background:rgba(192,57,43,.22);border:2px solid var(--danger);color:#ffb8b0;font-weight:700;}

  /* ---------- PANELS ---------- */
  #layer-panel{z-index:45;background:rgba(8,5,2,.6);display:flex;align-items:center;justify-content:center;padding:14px;overflow-y:auto;}
  .pcard{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:3px solid var(--wood);border-radius:22px;
    max-width:660px;width:100%;max-height:88vh;overflow-y:auto;padding:18px 16px 22px;position:relative;
    box-shadow:0 24px 50px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.1);}
  .pclose{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.4);
    border:2px solid var(--wood);color:var(--text);display:flex;align-items:center;justify-content:center;font-size:15px;}
  .ptitle{font-family:'Cinzel',serif;font-size:19px;color:var(--gold);margin:0 36px 4px 2px;}
  .psub{font-size:13px;color:var(--text-faint);margin:0 0 14px 2px;}
  .card{background:rgba(0,0,0,.26);border:2px solid rgba(255,255,255,.08);border-radius:15px;padding:13px;margin-bottom:11px;}
  .card:last-child{margin-bottom:0;}
  .card h3{font-family:'Cinzel',serif;font-size:14px;margin:0 0 9px;color:var(--gold);}
  .muted{color:var(--text-faint);font-size:13.5px;}
  .btn{font-weight:800;font-size:13px;color:#3a2408;border-radius:11px;padding:9px 13px;
    background:linear-gradient(180deg,var(--gold),var(--gold-2));box-shadow:0 3px 0 var(--gold-dark),0 4px 8px var(--sh);}
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--gold-dark);}
  .btn:disabled{background:linear-gradient(180deg,#6a6152,#4a4438);box-shadow:0 3px 0 #33301f;color:#9a9284;cursor:not-allowed;}
  .btn.sec{background:linear-gradient(180deg,#6b4f33,#43301d);color:var(--text);box-shadow:0 3px 0 #2b1d10,0 4px 8px var(--sh);}
  .btn.dgr{background:linear-gradient(180deg,#e0594a,#a82a1d);color:#fff;box-shadow:0 3px 0 #6e1a11;}
  .btn.sm{font-size:11.5px;padding:7px 10px;border-radius:9px;}
  .row{display:flex;gap:8px;align-items:center;}
  .between{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px;font-size:13.5px;}
  .grid2 .k{display:block;font-size:11.5px;color:var(--text-faint);}
  .bar-lg{height:10px;border-radius:6px;background:rgba(0,0,0,.4);overflow:hidden;margin-top:6px;}
  .bar-lg i{display:block;height:100%;background:var(--exp);}
  .eq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:8px;}
  .slot{background:rgba(0,0,0,.3);border:2px dashed rgba(255,255,255,.14);border-radius:13px;padding:8px;display:flex;gap:8px;align-items:center;min-height:58px;}
  .slot.on{border-style:solid;}
  .sic{width:34px;height:34px;flex:none;border-radius:9px;background:rgba(0,0,0,.32);display:flex;align-items:center;justify-content:center;font-size:17px;}
  .stx{flex:1;min-width:0;}
  .stx .n{display:block;font-size:13px;font-weight:700;line-height:1.2;}
  .stx .s{font-size:11.5px;color:var(--text-faint);}
  .inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:8px;}
  .item{background:rgba(0,0,0,.3);border:2px solid rgba(255,255,255,.12);border-radius:13px;padding:9px;display:flex;flex-direction:column;gap:6px;}
  .item .h{display:flex;gap:7px;align-items:center;font-weight:700;font-size:13px;}
  .ib{width:24px;height:24px;border-radius:7px;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font-size:13px;flex:none;}
  .tag{font-size:10px;font-weight:800;padding:2px 7px;border-radius:7px;display:inline-block;}
  .ibody{font-size:12px;color:var(--text-dim);line-height:1.45;}
  .ach{display:flex;gap:10px;align-items:center;background:rgba(0,0,0,.26);border:1px solid rgba(255,255,255,.1);border-radius:13px;padding:9px 11px;margin-bottom:7px;}
  .ach:last-child{margin-bottom:0;}
  .ach.done{border-color:var(--ok);}
  .achk{width:27px;height:27px;flex:none;border-radius:50%;background:rgba(0,0,0,.3);border:2px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:13px;}
  .ach.done .achk{background:var(--ok);border-color:#4d7a34;color:#0d1206;}
  .shoprow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed rgba(255,255,255,.12);}
  .shoprow:last-child{border-bottom:none;}
  .bpreview{width:96px;height:96px;flex:none;}
  .bpreview svg,.bpreview img{width:100%;height:100%;}
  .bpreview img{object-fit:contain;}

  /* ---------- STAGE PICKER / LOOT ---------- */
  .stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(126px,1fr));gap:9px;}
  .stage{background:rgba(0,0,0,.3);border:2px solid rgba(255,255,255,.12);border-radius:15px;padding:10px 8px;
    display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;}
  .stage.boss{border-color:var(--gold);background:linear-gradient(180deg,rgba(255,206,84,.16),rgba(0,0,0,.3));}
  .stage.locked{opacity:.45;}
  .stage .art{width:78px;height:78px;}
  .stage .art svg,.stage .art img{width:100%;height:100%;}
  .stage .art img{object-fit:contain;}
  .stage .eta{font-size:10.5px;font-weight:800;color:var(--gold);letter-spacing:.5px;text-transform:uppercase;}
  .stage .nm{font-size:13px;font-weight:700;line-height:1.2;}
  .stage .lv{font-size:11.5px;color:var(--text-faint);}
  .stage .btn{width:100%;margin-top:2px;}
  .loot-row{display:flex;justify-content:space-between;align-items:center;font-size:14.5px;padding:5px 2px;}
  .loot-row b{color:var(--gold);}
  .loot-item{display:flex;gap:10px;align-items:center;background:rgba(0,0,0,.32);border-radius:13px;padding:9px 11px;margin-top:10px;text-align:left;border:2px solid var(--wood);}
  .loot-art{width:74px;height:74px;margin:0 auto;}
  .loot-art img{width:100%;height:100%;object-fit:contain;}
  .stat-line{display:flex;justify-content:space-between;font-size:13.5px;padding:3px 0;border-bottom:1px dashed rgba(255,255,255,.08);}
  .stat-line:last-child{border-bottom:none;}
  .stat-line span:last-child{font-weight:700;color:var(--text);}
  .ach-rw{font-size:11.5px;font-weight:700;color:var(--gold);margin-top:3px;}

  /* ---------- MODALS / TOASTS ---------- */
  .mbg{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px;}
  .modal{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:3px solid var(--wood);border-radius:20px;padding:18px;
    max-width:340px;width:100%;text-align:center;box-shadow:0 24px 50px rgba(0,0,0,.6);}
  .modal h3{font-family:'Cinzel',serif;margin:2px 0 8px;color:var(--gold);font-size:17px;}
  .modal p{font-size:13.5px;color:var(--text-dim);margin:5px 0;}
  .modal .row{justify-content:center;margin-top:13px;}
  #toasts{position:fixed;top:8px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:70;width:min(92vw,420px);pointer-events:none;}
  .toast{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:2px solid var(--gold-dark);border-radius:13px;padding:9px 13px;font-size:13.5px;
    box-shadow:0 6px 14px var(--sh);animation:tin .25s ease;}
  .toast.ach{border-color:var(--rarity-epic);}
  @keyframes tin{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:none;}}

  /* ---------- DAILY QUEST WIDGET ---------- */
  .quests{position:absolute;right:14px;bottom:124px;width:264px;z-index:41;
    background:var(--hud);backdrop-filter:blur(4px);border-radius:20px;padding:10px 12px 12px;

<script>
(function(){
'use strict';

/* =====================================================================
   1. ISO ENGINE — screen projection, shading, primitives
===================================================================== */
const TW = 56, TH = 28, TZ = 26;
let uidSeq = 1;

function iso(x,y,z){ return [ (x-y)*TW/2, (x+y)*TH/2 - (z||0)*TZ ]; }
function P(p){ return p[0].toFixed(1)+','+p[1].toFixed(1); }
function poly(pts, fill, extra){
  return '<polygon points="'+pts.map(P).join(' ')+'" fill="'+fill+'"'+(extra||'')+'/>';
}
function hex2rgb(h){
  h = h.replace('#','');
  if(h.length===3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];
}
function shade(hex, amt){
  const c = hex2rgb(hex);
  const f = amt < 0 ? 0 : 255;
  const t = Math.abs(amt);
  const r = Math.round((f - c[0])*t + c[0]), g = Math.round((f - c[1])*t + c[1]), b = Math.round((f - c[2])*t + c[2]);
  return 'rgb('+r+','+g+','+b+')';
}
const TOP=0.10, LEFTF=-0.16, RIGHTF=-0.36;

function isoBox(x,y,z,w,d,h,color){
  const top   = [iso(x,y,z+h), iso(x+w,y,z+h), iso(x+w,y+d,z+h), iso(x,y+d,z+h)];
  const left  = [iso(x,y+d,z), iso(x+w,y+d,z), iso(x+w,y+d,z+h), iso(x,y+d,z+h)];
  const right = [iso(x+w,y,z), iso(x+w,y+d,z), iso(x+w,y+d,z+h), iso(x+w,y,z+h)];
  return poly(left, shade(color,LEFTF)) + poly(right, shade(color,RIGHTF)) + poly(top, shade(color,TOP));
}
function isoPyr(x,y,z,w,d,h,color){
  const ap = iso(x+w/2, y+d/2, z+h);
  const a=iso(x,y,z), b=iso(x+w,y,z), c=iso(x+w,y+d,z), e=iso(x,y+d,z);
  return poly([a,b,ap], shade(color,-0.30)) + poly([a,e,ap], shade(color,-0.30))
       + poly([b,c,ap], shade(color,RIGHTF)) + poly([e,c,ap], shade(color,TOP));
}
/* ridge (gable) roof running along x */
function isoRoof(x,y,z,w,d,h,color){
  const r1 = iso(x, y+d/2, z+h), r2 = iso(x+w, y+d/2, z+h);
  const a=iso(x,y,z), b=iso(x+w,y,z), c=iso(x+w,y+d,z), e=iso(x,y+d,z);
  return poly([a,b,r2,r1], shade(color,-0.34)) + poly([e,c,r2,r1], shade(color,TOP))
       + poly([a,e,r1], shade(color,-0.10)) + poly([b,c,r2], shade(color,-0.42));
}
function ellPts(cx,cy,rx,ry,a0,a1,n){
  const out=[];
  for(let i=0;i<=n;i++){
    const t = a0 + (a1-a0)*i/n;
    out.push([cx+rx*Math.cos(t), cy+ry*Math.sin(t)]);
  }
  return out;
}
function isoCyl(cx,cy,z,r,h,color){
  const rx = r*TW/2, ry = r*TH/2;
  const t = iso(cx,cy,z+h), b = iso(cx,cy,z);
  const body = [[t[0]-rx,t[1]]].concat(ellPts(b[0],b[1],rx,ry,Math.PI,0,14)).concat([[t[0]+rx,t[1]]]);
  let s = poly(body, shade(color,-0.26));
  s += '<ellipse cx="'+t[0].toFixed(1)+'" cy="'+t[1].toFixed(1)+'" rx="'+rx.toFixed(1)+'" ry="'+ry.toFixed(1)+'" fill="'+shade(color,TOP)+'"/>';
  return s;
}
function isoCone(cx,cy,z,r,h,color){
  const rx = r*TW/2, ry = r*TH/2;
  const b = iso(cx,cy,z), ap = iso(cx,cy,z+h);
  const pts = [[b[0]-rx,b[1]]].concat(ellPts(b[0],b[1],rx,ry,Math.PI,0,12)).concat([[b[0]+rx,b[1]],ap]);
  let s = poly(pts, shade(color,-0.18));
  s += poly([[b[0]-rx,b[1]],ap,[b[0],b[1]+ry]], shade(color,TOP));
  return s;
}
/* flat quad on a constant-y face (front-left wall) */
function faceY(x0,x1,y,z0,z1,fill){
  return poly([iso(x0,y,z0),iso(x1,y,z0),iso(x1,y,z1),iso(x0,y,z1)], fill);
}
/* flat quad on a constant-x face (front-right wall) */
function faceX(y0,y1,x,z0,z1,fill){
  return poly([iso(x,y0,z0),iso(x,y1,z0),iso(x,y1,z1),iso(x,y0,z1)], fill);
}
function isoDiamond(x,y,w,d,z,fill,extra){
  return poly([iso(x,y,z),iso(x+w,y,z),iso(x+w,y+d,z),iso(x,y+d,z)], fill, extra);
}
function isoPlatform(x,y,w,d,top,side,depth){
  depth = depth||1.5;
  const B=iso(x+w,y,0), C=iso(x+w,y+d,0), D=iso(x,y+d,0);
  const Bl=iso(x+w,y,-depth), Cl=iso(x+w,y+d,-depth), Dl=iso(x,y+d,-depth);
  let s = poly([B,C,Cl,Bl], shade(side,-0.34));
  s += poly([D,C,Cl,Dl], shade(side,-0.12));
  s += isoDiamond(x,y,w,d,0,top);
  s += poly([B,C,[C[0],C[1]+7],[B[0],B[1]+7]], shade(top,-0.30));
  s += poly([D,C,[C[0],C[1]+7],[D[0],D[1]+7]], shade(top,-0.16));
  return s;
}
function label(x,y,z,text,color,size,id){
  const p = iso(x,y,z);
  return '<text'+(id?' id="'+id+'"':'')+' x="'+p[0].toFixed(1)+'" y="'+p[1].toFixed(1)+'" text-anchor="middle" font-family="Baloo 2,sans-serif" '+
    'font-size="'+(size||13)+'" font-weight="800" fill="'+(color||'#fff6e2')+'" stroke="rgba(0,0,0,.55)" stroke-width="3" paint-order="stroke">'+text+'</text>';
}

/* ---- decorative iso props ---- */
function propTree(x,y,z,s,dark){
  s = s||1;
  const green = dark ? '#3d7038' : '#5aa04a';
  let o = '<g>';
  o += '<ellipse cx="'+iso(x,y,z)[0].toFixed(1)+'" cy="'+iso(x,y,z)[1].toFixed(1)+'" rx="'+(16*s)+'" ry="'+(7*s)+'" fill="rgba(0,0,0,.18)"/>';
  o += isoCyl(x,y,z,0.22*s,0.42*s,'#7a5433');
  o += isoCone(x,y,z+0.34*s,0.62*s,0.72*s, shade(green,-0.12));
  o += isoCone(x,y,z+0.72*s,0.48*s,0.66*s, green);
  o += isoCone(x,y,z+1.06*s,0.32*s,0.56*s, shade(green,0.12));
  o += '</g>';
  return o;
}
function propRock(x,y,z,s){
  s=s||1;
  const c='#9aa0a6';
  let o='<g>';
  o += isoBox(x,y,z,0.6*s,0.5*s,0.3*s,c);
  o += isoBox(x+0.22*s,y+0.12*s,z+0.3*s,0.32*s,0.3*s,0.22*s, shade(c,0.08));
  o += '</g>';
  return o;
}
function propBush(x,y,z,s){
  s=s||1;
  let o='<g>';
  o += isoCone(x,y,z,0.5*s,0.34*s,'#54913f');
  o += isoCone(x+0.24*s,y+0.1*s,z,0.38*s,0.3*s,'#69ab4e');
  o += '</g>';
  return o;
}
function propFlag(x,y,z,h,color){
  const b=iso(x,y,z), t=iso(x,y,z+h);
  return '<line x1="'+b[0].toFixed(1)+'" y1="'+b[1].toFixed(1)+'" x2="'+t[0].toFixed(1)+'" y2="'+t[1].toFixed(1)+
    '" stroke="#5b4326" stroke-width="2.5"/>'+
    poly([[t[0],t[1]],[t[0]+16,t[1]+5],[t[0],t[1]+12]], color);
}
function propBarrel(x,y,z,s){
  s=s||1;
  return isoCyl(x,y,z,0.24*s,0.36*s,'#8a5a34');
}
function propCrate(x,y,z,s){
  s=s||1;
  return isoBox(x,y,z,0.42*s,0.42*s,0.34*s,'#a97a45');
}

/* =====================================================================
   2. CREATURE ART — vector SVG with outlines, gradients, faces
===================================================================== */
const OUT = 'rgba(28,16,6,.55)';
function defsGrad(u,p){
  return '<defs><radialGradient id="'+u+'" cx="34%" cy="26%" r="78%">'+
    '<stop offset="0%" stop-color="'+(p.light||'#fff')+'"/>'+
    '<stop offset="55%" stop-color="'+(p.base||'#888')+'"/>'+
    '<stop offset="100%" stop-color="'+(p.dark||'#333')+'"/></radialGradient></defs>';
}
function shadowEll(cx,cy,rx,ry){
  return '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'" fill="rgba(0,0,0,.2)"/>';
}
function eyes(x1,x2,y,p,r){
  r = r||6;
  const e = p.eye||'#1b1410';
  let s='';
  [x1,x2].forEach(function(x){
    s += '<ellipse cx="'+x+'" cy="'+y+'" rx="'+r+'" ry="'+(r*1.18).toFixed(1)+'" fill="#fffdf5" stroke="'+OUT+'" stroke-width="1.5"/>';
    s += '<circle cx="'+(x+0.8)+'" cy="'+(y+1.2)+'" r="'+(r*0.48).toFixed(1)+'" fill="'+e+'"/>';
    s += '<circle cx="'+(x-1.4)+'" cy="'+(y-1.8)+'" r="1.7" fill="#fff"/>';
  });
  return s;
}
const CREATURES = {

   2b. WARSTWA GRAFIKI — pliki z katalogu art/ zamiast rysunku proceduralnego
   Zasób, którego nie ma, po prostu nie istnieje: gra rysuje jak dotąd.
===================================================================== */
const ART_DIR = 'art/';
const ART_OK = {};           /* 'mob:slime1' -> 'art/mob-slime1.png' */
let artReady = false;
function artFileFor(key){
  if(key === 'hero') return ['hero.png','hero.webp'];
  for(const z of ZONES){
    if(z.boss === key) return ['boss-'+z.id+'.png','boss-'+z.id+'.webp'];
    if(z.monsters.indexOf(key) >= 0) return ['mob-'+key+'.png','mob-'+key+'.webp'];
  }
  return null;
}
function probeArt(done){
  const jobs = [];
  const keys = ['hero'];
  ZONES.forEach(function(z){ keys.push.apply(keys, z.monsters); keys.push(z.boss); });
  keys.forEach(function(k){
    const files = artFileFor(k);
    if(files) jobs.push({slot:'mob:'+k, files:files});
  });
  ZONES.forEach(function(z){
    jobs.push({slot:'arena:'+z.id, files:['arena-'+z.id+'.jpg','arena-'+z.id+'.png','arena-'+z.id+'.webp']});
  });
  let left = jobs.length;
  if(!left){ done(); return; }
  jobs.forEach(function(job){
    let i = 0;
    (function tryNext(){
      if(i >= job.files.length){ if(!--left) done(); return; }
      const url = ART_DIR + job.files[i++];
      const img = new Image();
      img.onload = function(){ ART_OK[job.slot] = url; if(!--left) done(); };
      img.onerror = tryNext;
      img.src = url;
    })();
  });
}
function creatureArt(key, shape, p, cls){
  const src = key && ART_OK['mob:'+key];
  if(src) return '<img class="creature art '+(cls||'')+'" src="'+src+'" alt="" draggable="false">';
  return creatureSVG(shape, p, cls);
}
function creatureSVG(kind, p, cls){
  const u = 'c'+(uidSeq++);
  const fn = CREATURES[kind] || CREATURES.slime;
  return '<svg class="creature '+(cls||'')+'" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">'+fn(p||{},u)+'</svg>';
}

  const st = ' stroke="#241a10" stroke-width="1.5" stroke-linejoin="round"';
  let g = '';
  if(it.slot==='weapon'){
    const blade = k<=2 ? 'M16,2 L20.5,10 L20.5,21 L11.5,21 L11.5,10 Z'
      : k<=4 ? 'M16,1.5 L21.5,11 L19,21 L13,21 L10.5,11 Z'
      : 'M9,21 C9,10 16,3 24,3 C18,7 15,13 14.5,21 Z';
    g = '<path d="'+blade+'" fill="'+t.m+'"'+st+'/>'+
        '<path d="M16,4 L16,20" stroke="'+t.a+'" stroke-width="1.6" opacity=".8"/>'+
        '<rect x="8.5" y="20.5" width="15" height="3.4" rx="1.6" fill="#8a5a34"'+st+'/>'+
        '<rect x="14.4" y="23.5" width="3.2" height="6" rx="1.4" fill="#6b4a2a"'+st+'/>'+
        (k>=4?'<circle cx="16" cy="26.5" r="2.1" fill="'+t.g+'"'+st+'/>':'');
  } else if(it.slot==='armor'){
    g = '<path d="M8,7 L13,4.5 L16,7 L19,4.5 L24,7 L23,20 Q16,28 9,20 Z" fill="'+t.m+'"'+st+'/>'+
        '<path d="M16,7 L16,24" stroke="'+t.d+'" stroke-width="1.6"/>'+
        '<path d="M9.5,11 L22.5,11" stroke="'+t.a+'" stroke-width="1.5" opacity=".75"/>'+
        (k>=3?'<circle cx="16" cy="14.5" r="2.6" fill="'+t.g+'"'+st+'/>':'');
  } else if(it.slot==='shield'){
    g = '<path d="M16,3 L26,7 Q26,21 16,28 Q6,21 6,7 Z" fill="'+t.m+'"'+st+'/>'+
        '<path d="M16,6.5 L23,9.3 Q23,19.5 16,24.5 Q9,19.5 9,9.3 Z" fill="'+t.d+'" opacity=".55"/>'+
        '<path d="M16,8 L16,22 M10,13 L22,13" stroke="'+t.a+'" stroke-width="1.8" stroke-linecap="round"/>'+
        (k>=4?'<circle cx="16" cy="13" r="2.4" fill="'+t.g+'"'+st+'/>':'');
  } else if(it.slot==='helm'){
    g = '<path d="M7,19 Q7,5 16,5 Q25,5 25,19 L25,23 L7,23 Z" fill="'+t.m+'"'+st+'/>'+
        '<rect x="7" y="15.5" width="18" height="4.5" fill="'+t.d+'"'+st+'/>'+
        '<rect x="14.5" y="9" width="3" height="11" rx="1.4" fill="'+t.a+'"'+st+'/>'+
        (k>=4?'<path d="M16,5 Q20,0 24,2 Q21,5 17,6 Z" fill="'+t.g+'"'+st+'/>':'');
  } else if(it.slot==='gloves'){
    g = '<path d="M9,14 L9,8 Q9,6 11,6 Q13,6 13,8 L13,13 L14,5.5 Q14.3,3.5 16.3,3.8 Q18.2,4.1 17.9,6 L17,13.5 L18.6,7.5 Q19.1,5.6 21,6.1 Q22.8,6.6 22.3,8.5 L21,17 Q20,24 15,26 Q9.5,27 8,21 L6.5,16 Q6,14 7.6,13.4 Q9,12.9 9,14 Z" fill="'+t.m+'"'+st+'/>'+
        '<path d="M9,19 Q15,22 20,19" stroke="'+t.d+'" stroke-width="1.8" fill="none"/>'+
        (k>=4?'<circle cx="14.5" cy="22" r="2.2" fill="'+t.g+'"'+st+'/>':'');
  } else if(it.slot==='boots'){
    g = '<path d="M11,4 L18,4 L18,17 L25,21 Q27,22.5 26,25.5 L9,25.5 Q7,25.5 7,23 L7,4 Z" fill="'+t.m+'"'+st+'/>'+
        '<path d="M7,21.5 L26,23.5" stroke="'+t.d+'" stroke-width="2"/>'+
        '<path d="M8.5,9 L17,9 M8.5,13 L17,13" stroke="'+t.a+'" stroke-width="1.5" opacity=".8"/>'+
        (k>=4?'<path d="M19,6 L23,10 L19,14 Z" fill="'+t.g+'"'+st+'/>':'');
  } else if(it.slot==='ring'){
    g = '<circle cx="16" cy="19" r="8.5" fill="none" stroke="'+t.m+'" stroke-width="4"/>'+
        '<circle cx="16" cy="19" r="8.5" fill="none" stroke="#241a10" stroke-width="1.2"/>'+
        '<path d="M16,4 L20,9 L16,14 L12,9 Z" fill="'+t.g+'"'+st+'/>'+
        '<path d="M16,5.5 L18.4,9 L16,12.5 Z" fill="'+t.a+'" opacity=".8"/>';

    g = '<path d="M7,6 Q16,20 25,6" fill="none" stroke="'+t.m+'" stroke-width="3" stroke-linecap="round"/>'+
        '<path d="M7,6 Q16,20 25,6" fill="none" stroke="#241a10" stroke-width="1" opacity=".6"/>'+
        '<circle cx="16" cy="21" r="6" fill="'+t.g+'"'+st+'/>'+
        '<circle cx="14" cy="19" r="2" fill="'+t.a+'" opacity=".85"/>';
  }
  return '<svg viewBox="0 0 32 32" width="'+(px||30)+'" height="'+(px||30)+'" xmlns="http://www.w3.org/2000/svg">'+g+'</svg>';
}

function achTarget(a, lvl){ return a.tiers[Math.min(lvl, a.tiers.length-1)]; }
function relicTotalLevels(s){

  Object.keys(r).forEach(k=>{ n += r[k]||0; });
  return n;
}

  if(!state.nodes) state.nodes = {};
  if(!state.nodes[id]) state.nodes[id] = {lvl:0, at:Date.now()};
  return state.nodes[id];
}
function nodeRate(nd, lvl){ return lvl>0 ? Math.round(nd.base*Math.pow(lvl,1.25)) : 0; }

function guardianOf(nd, lvl){
  const pals = [MONSTERS.wolf1.p, MONSTERS.golem1.p, MONSTERS.spider2.p, MONSTERS.slime2.p, MONSTERS.ghost2.p, MONSTERS.boss_krypta.p];
  return {name:nd.guardName+' '+toRoman(lvl+1), shape:nd.shapes[lvl % nd.shapes.length], kind:'guard',
    level:guardLevel(lvl), boss:((lvl+1) % 3 === 0), p:pals[lvl % pals.length]};

function toRoman(n){ return ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'][n-1] || String(n); }

function migrate(s){
  const d = defaultState();
  /* UWAGA: nie wolno mieszać d z s w miejscu — Object.assign(d,s) podmieniłby
     zagnieżdżone obiekty domyślne i nowe pola (sloty, statystyki) by przepadły. */
  const out = Object.assign({}, d, s);
  out.equipment = Object.assign({}, d.equipment, s.equipment||{});
  /* stary slot „accessory" stał się naszyjnikiem */
  if(out.equipment.accessory){
    const acc = out.equipment.accessory;
    if(acc && !out.equipment.amulet){ acc.slot = 'amulet'; out.equipment.amulet = acc; }
    delete out.equipment.accessory;
  }
  out.stats = Object.assign({}, d.stats, s.stats||{});

/* ---------- items ---------- */
let itemSeq = Date.now()%100000;
function rollRarity(isBoss){
  const key = isBoss ? 'wb' : 'w';
  const total = RARITIES.reduce((a,r)=>a+r[key],0);

}

  STAT_KEYS.forEach(function(k){
    if(base[k]) it[k] = Math.max(1, Math.round(base[k][idx]*rarity.mult));

  it.value = Math.round(10*tier*rarity.mult);

}

/* ---------- zadania dzienne ---------- */
function rollDaily(){
  const pool = DAILY_POOL.slice();
  const picked = [];
  while(picked.length < DAILY_COUNT && pool.length){
    picked.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  }
  return {date: todayKey(), quests: picked.map(function(q){
    let target = q.target;
    if(q.id==='gold') target = Math.round(q.target * (1 + state.level*0.08));
    if(q.id==='res')  target = Math.round(q.target * (1 + state.level*0.05));
    if(q.id==='kill') target = q.target + Math.floor(state.level/10);
    return {id:q.id, target:target, prog:0, claimed:false};
  }), bonus:false};
}
function ensureDaily(){
  if(!state.daily || state.daily.date !== todayKey()){
    state.daily = rollDaily();

}
function dailyDef(id){ return DAILY_POOL.find(q=>q.id===id); }

  const d = ensureDaily();

  d.quests.forEach(function(q){
    if(q.id !== id || q.claimed) return;
    if(q.prog >= q.target) return;
    q.prog = Math.min(q.target, q.prog + n);
    if(q.prog >= q.target){ toast('📜 Zadanie ukończone: '+dailyDef(id).name+' — odbierz skrzynię!'); }
    changed = true;
  });
  if(changed){ renderQuests(); saveState(); }
}

  q.claimed = true;
  state.chests = (state.chests||0) + 1;
  state.stats.dailyDone = (state.stats.dailyDone||0) + 1;
  if(d.quests.every(x=>x.claimed) && !d.bonus){

function openChest(){

  state.chests--;
  const t = bestTier();
  const rw = {key:0, gold:0, gems:0, shard:0, item:null};
  const roll = Math.random();
  if(roll < 0.45) rw.key = 1;
  else if(roll < 0.62) rw.key = 2;
  rw.gold  = Math.round((90 + Math.random()*130) * t);
  rw.shard = Math.round(6 + Math.random()*10 + t*2);
  if(Math.random() < 0.35) rw.gems = 1 + Math.floor(Math.random()*t);
  if(Math.random() < 0.5){
    rw.item = createItem(SLOT_KEYS[Math.floor(Math.random()*SLOT_KEYS.length)], t, rollRarity(true));
  }
  state.keys = (state.keys||0) + rw.key;
  addGold(rw.gold); addGems(rw.gems);
  state.res.shard = (state.res.shard||0) + rw.shard;
  if(rw.item && !giveItem(rw.item, true)){ rw.item = null; rw.lost = true; }

function upgradeRelic(id){

  const cost = relicCost(lvl);
  if((state.res.shard||0) < cost){ toast('Potrzebujesz '+cost+' 🔮 odłamków.'); return; }
  state.res.shard -= cost;
  if(!state.relics) state.relics = {};
  state.relics[id] = lvl + 1;
  if(lvl === 0){
    /* pierwszy zdobyty relikt od razu ląduje w wolnym gnieździe */
    const free = state.relicSlots.indexOf(null);
    if(free >= 0 && free < relicSlotCount()) state.relicSlots[free] = id;
  }
  toast(def.icon+' '+def.name+' — poziom '+(lvl+1));

}

const HERO_LIFETIME = 10*60000;

    stone:Math.round(12*Math.pow(1.6, lvl-1))};

function buildOrUpgrade(id){
  const def = BUILDINGS[id]; if(!def) return;
  const lvl = bLvl(id), next = lvl+1;
  if(next > def.max){ toast('Osiągnięto maksymalny poziom.'); return; }
  if(id !== 'keep' && next > bLvl('keep')){ toast('Najpierw rozbuduj Zamek do poziomu '+next+'.'); return; }
  const cost = bcostFull(id, next);
  if(!canAfford(cost)){ toast('Brakuje surowców: '+cost.gold+' zł, '+cost.wood+' 🪵, '+cost.stone+' 🪨'); return; }
  state.gold -= cost.gold; state.res.wood -= cost.wood; state.res.stone -= cost.stone;
  if(id === 'mine' && lvl === 0) state.mineAt = Date.now();
  if(id === 'mine') collectMine(true);
  if(id === 'sawmill'){ if(lvl === 0) state.sawAt = Date.now(); else collectSaw(true); }

  if(state.hp > totalMaxHp()) state.hp = totalMaxHp();

  questProgress('build', 1);
  checkAchievements(); render(); saveState();
}

/* ---------- battle ---------- */
let battleTimer = null;
/* skala pancerza rośnie z poziomem starcia, żeby obrona nigdy nie zerowała obrażeń */
function defK(level){ return 80 + 16*level; }

/* --- Krzywa mocy odniesienia ---------------------------------------
   Statystyki potworów nie są zgadywane, tylko wyliczane z tego, ile
   realnie ma bohater na danym poziomie (sensowny ekwipunek z aktualnej
   krainy + rozdane punkty + koszary/kuźnia). Dzięki temu balans trzyma
   się na każdym poziomie, nawet gdy zmienią się tabele przedmiotów. */
function refTier(L){ let t = 1; ZONES.forEach(function(z){ if(L >= z.unlockLevel) t = z.tier; }); return t; }
/* rozpiętość poziomów krainy — ile bohater zwykle w niej urośnie */
ZONES.forEach(function(z, i){
  const next = ZONES[i+1];
  z.span = (next ? next.unlockLevel : z.unlockLevel + 14) - z.unlockLevel;
});
/* poziom bohatera, jakiego kraina spodziewa się na danym etapie */
function stageRefLevel(z, idx){
  /* pierwszy etap krainy mierzymy dokładnie poziomem jej odblokowania —
     gracz wchodzi tu od razu, jeszcze bez łupu z tej krainy */
  const f = idx >= 3 ? 0.72 : idx*0.18;
  return Math.max(1, Math.round(z.unlockLevel + z.span*f));
}
/* Ile "dorobku" (ekwipunek, punkty, budynki) ma realnie bohater na danym
   poziomie. Na 1. poziomie nie ma NIC — bez tego pierwszy szlam byłby
   liczony jak przeciwnik dla gracza w pełnej zbroi i nie dało się go ubić. */
function gearFrac(L){ return Math.min(1, Math.max(0, (L-1)/5)); }
const REF_CACHE = {};
function refPower(L, tier){
  const ck = L+'/'+(tier||0);
  if(REF_CACHE[ck]) return REF_CACHE[ck];
  const idx = (tier || refTier(L)) - 1;
  const rar = (L < 10 ? RARITIES[0] : RARITIES[1]).mult;
  const upgM = 1 + 0.08*Math.min(6, Math.floor(L/6));
  const bar = Math.min(15, Math.floor(L/6));
  const pts = Math.round((L-1)*3*0.8), ap = Math.round(pts*0.4), g = gearFrac(L);
  let atk = baseAtk(L) + Math.round((bar*3 + ap*2) * g);
  let def = baseDef(L) + Math.round((bar*2 + Math.round(ap*1.5)) * g);
  let hp  = baseHp(L);
  SLOT_KEYS.forEach(function(k){
    const b = SLOT_BASE[k];
    if(b.atk) atk += Math.round(Math.max(1, Math.round(b.atk[idx]*rar))*upgM*g);
    if(b.def) def += Math.round(Math.max(1, Math.round(b.def[idx]*rar))*upgM*g);
    if(b.hp)  hp  += Math.round(Math.max(1, Math.round(b.hp[idx]*rar))*upgM*g);
  });
  REF_CACHE[ck] = {atk:atk, def:def, hp:hp};
  return REF_CACHE[ck];
}
/* ile rund ma trwać starcie z danym typem przeciwnika */
const PACE = {
  normal:{kill:6,  survive:20},
  boss:  {kill:12, survive:17},
  elite: {kill:12, survive:14},
};
function monsterStats(m){
  const L = m.level, K = defK(L);
  /* moc odniesienia liczy się z poziomu i wyposażenia, jakie bohater
     REALNIE ma na tej zawartości — nie z poziomu samego potwora */
  const R = refPower(m.refLevel || L, m.refTier);
  const pace = m.elite ? PACE.elite : m.boss ? PACE.boss : PACE.normal;
  const def = Math.round(0.45*K);
  const heroDmg = R.atk * (K/(K+def));
  const hp  = Math.max(8, Math.round(heroDmg * pace.kill));
  const atk = Math.max(2, Math.round(R.hp/pace.survive * (K+R.def)/K));
  let gold = Math.round(4 + L*2.4 + Math.pow(L,1.45)*0.5);
  let exp  = Math.round(8 + L*4 + Math.pow(L,1.5)*1.2);
  let crit=5, critpow=150, dodge=3, stun=0, spd=0;
  if(m.boss){ gold=Math.round(gold*3.5); exp=Math.round(exp*3.2); crit=12; critpow=170; dodge=7; stun=6; spd=10; }
  if(m.elite){ gold=Math.round(gold*2.4); exp=Math.round(exp*2.4); crit=16; critpow=185; dodge=10; stun=8; spd=14; }
  return {hp:hp, atk:atk, def:def, gold:gold, exp:exp, crit:crit, critpow:critpow, dodge:dodge, stun:stun, spd:spd};
}
function stageList(z){
  return z.monsters.map(function(k,i){ return {key:k, idx:i, boss:false, cost:zoneCost(z)}; })
    .concat([{key:z.boss, idx:3, boss:true, cost:Math.round(zoneCost(z)*1.8)}]);
}
function stageMonster(z, idx){
  const key = stageList(z)[idx].key;
  return Object.assign({}, MONSTERS[key],
    {key: key, refLevel: stageRefLevel(z, idx), refTier: z.tier});
}
function zoneProgress(zid){ return (state.progress && state.progress[zid]) || 0; }
function stageUnlocked(z, st){ return st.idx <= zoneProgress(z.id); }
function zoneCleared(zid){ return zoneProgress(zid) >= 4; }
function beginBattle(b){
  state.battle = b;
  state.openPanel = null;

}
function startExplore(zoneId, stageIdx){
  if(state.battle || state.dungeon) return;

function fightHero(){
  if(state.battle || state.dungeon) return;
  if(!state.heroSpawn || !state.heroSpawn.alive){ toast('Herosa już tu nie ma.'); return; }
  const cost = heroCost();

  state.energy -= cost;

  const g = heroMonster(), ms = monsterStats(g);
  beginBattle({zoneId:null, hero:true, stageIdx:null, cost:cost, monster:Object.assign({}, g, ms, {maxHp:ms.hp}),
    log:['🦸 Wędrowny Heros dobywa oręża!'], pHit:false, mHit:false, mStun:0});
}
function pushLog(t){ const b=state.battle; if(!b) return; b.log.unshift(t); if(b.log.length>30) b.log.length=30; }
function strike(atk, def, crit, critpow, K){
  const v = 0.85 + Math.random()*0.3;
  const isCrit = Math.random()*100 < crit;
  let d = atk * (K/(K+def)) * v * (isCrit ? critpow/100 : 1);
  return {d:Math.max(1,Math.round(d)), crit:isCrit};
}
function battleTick(){
  try{ battleRound(); }
  catch(err){
    clearInterval(battleTimer); battleTimer = null;
    state.battle = null; state.hp = totalMaxHp();
    toast('Walka przerwana przez błąd — wracasz bezpiecznie.');
    try{ render(); saveState(); }catch(e){}
  }
}
function battleRound(){
  const b = state.battle;
  if(!b){ clearInterval(battleTimer); battleTimer=null; return; }
  const m = b.monster;
  const K = defK(m.level);
  /* --- tura bohatera (szybkość daje szansę na dodatkowy cios) --- */
  const hits = 1 + (Math.random()*100 < pSpeed() ? 1 : 0);
  for(let i=0;i<hits;i++){
    if(Math.random()*100 < m.dodge){ pushLog(m.name+' unika Twojego ciosu!'); continue; }
    const a = strike(totalAtk(), m.def, pCrit(), pCritPow(), K);
    m.hp -= a.d; b.mHit = true; b.pHit = false;
    let extra = '';
    const vamp = relicLvl('vampire');
    if(vamp){
      const heal = Math.max(1, Math.round(a.d * vamp*0.025));
      const before = state.hp;
      state.hp = Math.min(totalMaxHp(), state.hp + heal);
      if(state.hp > before) extra = ' 🩸+'+(state.hp-before);
    }
    pushLog((i?'Dodatkowy cios: ':'Zadajesz ')+a.d+' obr.'+(a.crit?' 💥 KRYTYK!':'')+extra);
    if(Math.random()*100 < pStun()){ b.mStun = 1; pushLog('⭐ Ogłuszasz przeciwnika!'); }
    if(m.hp <= 0){ endBattle(true); return; }
  }
  /* --- tura potwora --- */
  if(b.mStun > 0){ b.mStun--; pushLog(m.name+' jest ogłuszony i traci turę.'); renderBattle(); renderHud(); return; }
  const mHits = 1 + (Math.random()*100 < (m.spd||0) ? 1 : 0);
  for(let i=0;i<mHits;i++){
    if(Math.random()*100 < pDodge()){ pushLog('🌀 Unikasz ataku!'); continue; }
    const c = strike(m.atk, totalDef(), m.crit||5, m.critpow||150, K);
    const blk = pBlock();
    let dmg = c.d;
    if(blk > 0) dmg = Math.max(1, Math.round(dmg * (1 - blk/100)));
    state.hp -= dmg; b.pHit = true; b.mHit = false;
    pushLog(m.name+' rani Cię za '+dmg+(c.crit?' 💥 KRYTYK!':'')+(blk>0?' 🧱':'')+'.');
    if(state.hp <= 0){
      const ph = relicLvl('phoenix');
      if(ph && !b.revived){
        b.revived = true;
        state.hp = Math.max(1, Math.round(totalMaxHp()*(10+ph*4)/100));
        pushLog('🪶 Łza Feniksa! Wstajesz z '+state.hp+' życia.');
      } else { endBattle(false); return; }
    }
  }
  renderBattle(); renderHud();
}
function endBattle(won){
  clearInterval(battleTimer); battleTimer = null;
  const b = state.battle, m = b.monster, z = ZONES.find(x=>x.id===b.zoneId);
  const loot = {won:won, name:m.name, boss:!!m.boss, hero:!!b.hero, key:m.key, shape:m.shape, p:m.p, zone:z?z.name:'',
                zoneId:b.zoneId, stageIdx:b.stageIdx, guard:b.guard, cost:b.cost||0,
                gold:0, exp:0, gems:0, shard:0, item:null, lost:false, levelBefore:state.level};
  /* porażka zwraca energię wydaną na wyprawę */
  if(!won && loot.cost > 0){
    state.energy = Math.min(maxEnergy(), state.energy + loot.cost);
    loot.refund = loot.cost;
  }
  if(b.hero){
    if(won){
      state.heroSpawn.alive = false;
      state.heroSpawn.next = Date.now() + heroRespawnDelay();
      state.stats.heroesKilled = (state.stats.heroesKilled||0) + 1;
      state.stats.totalKills++;
      state.stats.kills.hero = (state.stats.kills.hero||0)+1;
      questProgress('kill', 1);
      loot.gold = Math.round(m.gold*(1+bonusPct()/100));
      loot.exp  = Math.round(m.exp*(1+bonusPct()/100)*expMult());
      loot.gems = 4 + Math.floor(Math.random()*6);
      loot.shard = 15 + Math.floor(Math.random()*20);
      addGold(loot.gold); grantExp(loot.exp); addGems(loot.gems);
      state.res.shard = (state.res.shard||0) + loot.shard;
      questProgress('gold', loot.gold);
      const t = bestTier();
      /* TYLKO heros może zostawić artefakt — 5% szansy */
      let it = (Math.random() < 0.05 + dropBonus()*0.2) ? createArtifact(null, t) : null;
      if(!it){
        let rar = rollRarity(true);
        const minRank = 3; /* z herosa zawsze epik lub lepszy */
        if(RARITIES.findIndex(r=>r.id===rar.id) < minRank) rar = RARITIES[minRank];
        it = createItem(SLOT_KEYS[Math.floor(Math.random()*SLOT_KEYS.length)], t, rar);
      }
      if(giveItem(it, true)) loot.item = it; else loot.lost = true;
    }
    loot.levelAfter = state.level;
    state.hp = totalMaxHp();
    checkAchievements();
    state.battle = null;
    render(); saveState();
    showLootModal(loot);
    return;
  }
  if(b.guard){
    const nd = state.nodes[b.guard];
    if(won){ nd.lvl = (nd.lvl||0)+1; nd.at = Date.now(); loot.nodeLvl = nd.lvl; loot.nodeId = b.guard;
      loot.gold = Math.round(m.gold*0.6); addGold(loot.gold);
      loot.exp = Math.round(m.exp*(1+bonusPct()/100)*expMult()); grantExp(loot.exp);
      state.stats.totalKills++;
      questProgress('kill', 1); questProgress('gold', loot.gold);
    }
    loot.levelAfter = state.level;
    state.hp = totalMaxHp();
    checkAchievements();
    state.battle = null;
    render(); saveState();
    showLootModal(loot);
    return;
  }
  if(won){
    loot.gold = Math.round(m.gold*(1+bonusPct()/100));
    loot.exp = Math.round(m.exp*(1+bonusPct()/100)*expMult());
    addGold(loot.gold); grantExp(loot.exp);
    state.stats.totalKills++;
    state.stats.kills[m.kind] = (state.stats.kills[m.kind]||0)+1;
    questProgress('kill', 1); questProgress('gold', loot.gold);
    if(!state.progress) state.progress = {};
    if(b.stageIdx === zoneProgress(z.id) && b.stageIdx < 4){
      state.progress[z.id] = b.stageIdx + 1;
      if(b.stageIdx < 3) loot.unlocked = stageList(z)[b.stageIdx+1];
      else loot.dungeonOpen = z.dungeon;
    }
    if(m.boss){
      state.stats.bossesKilled++;
      questProgress('boss', 1);
      loot.gems = 2 + Math.floor(Math.random()*z.tier);
      addGems(loot.gems);
      loot.shard = 4 + Math.floor(Math.random()*(3+z.tier));
      state.res.shard = (state.res.shard||0) + loot.shard;
      /* boss zawsze zostawia coś rzadkiego — artefaktów tu już nie ma */
      let rar = rollRarity(true);
      const minRank = 2;
      if(RARITIES.findIndex(r=>r.id===rar.id) < minRank) rar = RARITIES[minRank];
      const it = createItem(SLOT_KEYS[Math.floor(Math.random()*SLOT_KEYS.length)], z.tier, rar);
      if(giveItem(it, true)) loot.item = it; else loot.lost = true;
    } else {
      if(Math.random() < 0.05){ loot.gems = 1; addGems(1); }
      if(Math.random() < 0.42 + dropBonus()){
        const it = createItem(SLOT_KEYS[Math.floor(Math.random()*SLOT_KEYS.length)], z.tier, rollRarity(false));
        if(giveItem(it, true)) loot.item = it;
        else loot.lost = true;
      }
    }
  }
  loot.levelAfter = state.level;
  state.hp = totalMaxHp();
  checkAchievements();
  state.battle = null;
  render(); saveState();
  showLootModal(loot);
}
function fleeBattle(){
  if(!state.battle) return;
  clearInterval(battleTimer); battleTimer = null;
  state.battle = null; state.hp = totalMaxHp();
  render(); saveState();
}

/* =====================================================================
   5b. LOCHY — minigra zręcznościowa na 60 sekund
===================================================================== */
const DG_W = 15, DG_H = 11, DG_TIME = 60000;
const DG_LOOT = [
  {k:'shard', icon:'🔮', w:54, min:1, max:3},
  {k:'gold',  icon:'🪙', w:26, min:18, max:45},
  {k:'big',   icon:'💠', w:12, min:7, max:12},
  {k:'gems',  icon:'💎', w:8,  min:1, max:1},
];
let DG = null, dgTimer = null, dgHeld = null, dgHeldT = null;

function dungeonUnlocked(zid){ return zoneCleared(zid); }
function dgMakeGrid(seed){
  const rnd = mkRnd(seed);
  const g = [];
  for(let y=0;y<DG_H;y++){
    const row = [];
    for(let x=0;x<DG_W;x++) row.push(x===0||y===0||x===DG_W-1||y===DG_H-1 ? 1 : 0);
    g.push(row);
  }
  /* regularne filary + losowe bloki, zawsze z przejściem dookoła */
  for(let y=2;y<DG_H-2;y+=2){
    for(let x=2;x<DG_W-2;x+=2){
      if(rnd() < 0.78) g[y][x] = 1;
      if(rnd() < 0.3 && x+1 < DG_W-1) g[y][x+1] = 1;
    }
  }
  const cx = (DG_W>>1), cy = (DG_H>>1);
  g[cy][cx] = 0; g[cy][cx-1] = 0; g[cy][cx+1] = 0; g[cy-1][cx] = 0; g[cy+1][cx] = 0;
  /* odetnij kieszenie, do których nie da się dojść */
  const seen = [];
  for(let y=0;y<DG_H;y++) seen.push(new Array(DG_W).fill(false));
  const q = [[cx,cy]]; seen[cy][cx] = true;
  while(q.length){
    const c = q.shift();
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){
      const nx=c[0]+d[0], ny=c[1]+d[1];
      if(nx<0||ny<0||nx>=DG_W||ny>=DG_H) return;
      if(g[ny][nx] || seen[ny][nx]) return;
      seen[ny][nx] = true; q.push([nx,ny]);
    });
  }
  for(let y=0;y<DG_H;y++) for(let x=0;x<DG_W;x++) if(!g[y][x] && !seen[y][x]) g[y][x] = 1;
  return g;
}
function dgFreeCells(){
  const out = [];
  if(!DG) return out;
  for(let y=1;y<DG_H-1;y++) for(let x=1;x<DG_W-1;x++) if(!DG.grid[y][x]) out.push({x,y});
  return out;
}
function dgOccupied(x,y){
  if(!DG) return true;
  if(DG.player.x===x && DG.player.y===y) return true;
  return DG.items.some(i=>i.x===x&&i.y===y) || DG.ghosts.some(gh=>gh.x===x&&gh.y===y);
}
function dgSpawnItem(){
  if(!DG) return;
  const free = dgFreeCells().filter(c=>!dgOccupied(c.x,c.y));
  if(!free.length) return;
  const c = free[Math.floor(Math.random()*free.length)];
  const total = DG_LOOT.reduce((a,l)=>a+l.w,0);
  let roll = Math.random()*total, def = DG_LOOT[0];
  for(const l of DG_LOOT){ if(roll < l.w){ def = l; break; } roll -= l.w; }
  const amt = def.min + Math.floor(Math.random()*(def.max-def.min+1));
  DG.items.push({x:c.x, y:c.y, k:def.k, icon:def.icon, amt:amt});
}
function enterDungeon(zoneId){
  if(state.battle || state.dungeon) return;
  const z = ZONES.find(x=>x.id===zoneId);
  if(!z) return;
  if(!dungeonUnlocked(zoneId)){ toast('Najpierw pokonaj wszystkie etapy tej krainy.'); return; }
  if((state.keys||0) < 1){ toast('🗝️ Potrzebujesz klucza — znajdziesz go w skrzyniach za zadania dzienne.'); return; }
  state.keys--;
  state.openPanel = null;
  state.dungeon = {zoneId:zoneId};
  DG = {
    zone: z, tier: z.dungeon.tier,
    grid: dgMakeGrid(Math.floor(Math.random()*9000)+7),
    player: {x:(DG_W>>1), y:(DG_H>>1)},
    items: [], ghosts: [],
    endAt: Date.now() + DG_TIME,
    bag: {shard:0, gold:0, gems:0}, picks: 0, hits: 0, flash: 0, respawns: [],
  };
  for(let i=0;i<14;i++) dgSpawnItem();
  const ghostCount = Math.min(4, 1 + Math.floor(z.tier/2));
  const corners = [{x:1,y:1},{x:DG_W-2,y:1},{x:1,y:DG_H-2},{x:DG_W-2,y:DG_H-2}];
  for(let i=0;i<ghostCount;i++){
    let c = corners[i % corners.length];
    if(DG.grid[c.y][c.x]) c = dgFreeCells()[0];
    DG.ghosts.push({x:c.x, y:c.y, t:0});
  }
  saveState();
  render();
  if(dgTimer) clearInterval(dgTimer);
  dgTimer = setInterval(dgTick, 260);
  toast('⏱️ 60 sekund! Zbieraj, ile zdołasz.');
}
function dgMove(dx, dy){
  if(!DG) return;
  const nx = DG.player.x+dx, ny = DG.player.y+dy;
  if(nx<0||ny<0||nx>=DG_W||ny>=DG_H) return;
  if(DG.grid[ny][nx]) return;
  DG.player.x = nx; DG.player.y = ny;
  dgCollect();
  renderDungeon();
}
function dgCollect(){
  if(!DG) return;
  const p = DG.player;
  for(let i=DG.items.length-1;i>=0;i--){
    const it = DG.items[i];
    if(it.x!==p.x || it.y!==p.y) continue;
    DG.items.splice(i,1);
    DG.picks++;
    if(it.k==='gold') DG.bag.gold += it.amt;
    else if(it.k==='gems') DG.bag.gems += it.amt;
    else DG.bag.shard += it.amt;
    DG.respawns.push(setTimeout(dgSpawnItem, 600 + Math.random()*900));
  }
}
function dgTick(){
  if(!DG){ clearInterval(dgTimer); dgTimer=null; return; }
  if(Date.now() >= DG.endAt){ endDungeon(); return; }
  DG.ghosts.forEach(function(gh){
    gh.t++;
    if(gh.t % 2) return;
    const p = DG.player;
    const opts = [[1,0],[-1,0],[0,1],[0,-1]].filter(function(d){
      const nx=gh.x+d[0], ny=gh.y+d[1];
      return nx>0 && ny>0 && nx<DG_W-1 && ny<DG_H-1 && !DG.grid[ny][nx];
    });
    if(!opts.length) return;
    let pick;
    if(Math.random() < 0.55){
      opts.sort(function(a,b){
        const da = Math.abs(gh.x+a[0]-p.x)+Math.abs(gh.y+a[1]-p.y);
        const db = Math.abs(gh.x+b[0]-p.x)+Math.abs(gh.y+b[1]-p.y);
        return da-db;
      });
      pick = opts[0];
    } else pick = opts[Math.floor(Math.random()*opts.length)];
    gh.x += pick[0]; gh.y += pick[1];
  });
  const p = DG.player;
  if(DG.ghosts.some(g=>g.x===p.x&&g.y===p.y) && Date.now() - (DG.lastHit||0) > 1200){
    DG.lastHit = Date.now();
    DG.hits++;
    DG.endAt -= 5000;
    DG.flash = 3;
    const lost = Math.min(DG.bag.shard, 2);
    DG.bag.shard -= lost;
    toast('👻 Zjawa! −5 s'+(lost?' i −'+lost+' 🔮':''));
  }
  if(DG.flash > 0) DG.flash--;
  dgCollect();
  renderDungeon();
}
function endDungeon(){
  if(dgTimer){ clearInterval(dgTimer); dgTimer = null; }
  if(dgHeld){ clearInterval(dgHeld); dgHeld = null; }
  if(dgHeldT){ clearTimeout(dgHeldT); dgHeldT = null; }
  if(!DG) return;
  (DG.respawns||[]).forEach(clearTimeout);
  const bag = DG.bag, picks = DG.picks, z = DG.zone;
  const mult = 1 + (z.dungeon.tier-1)*0.35;
  const shard = Math.max(1, Math.round(bag.shard*mult));
  const gold  = Math.round(bag.gold*mult*(1+bonusPct()/100));
  const gems  = bag.gems;
  state.res.shard = (state.res.shard||0) + shard;
  addGold(gold); addGems(gems);
  questProgress('gold', gold);
  state.stats.dungeonRuns = (state.stats.dungeonRuns||0) + 1;
  if(picks > (state.stats.bestDungeon||0)) state.stats.bestDungeon = picks;
  DG = null; state.dungeon = null;
  checkAchievements(); render(); saveState();
  const d = modal('<h3 class="display">'+z.dungeon.icon+' '+z.dungeon.name+'</h3>'+
    '<p class="muted" style="margin-top:-2px">Czas minął — zebrano '+picks+' skarbów.</p>'+
    '<div style="margin-top:8px">'+
    '<div class="loot-row"><span>🔮 Odłamki reliktów</span><b>+'+shard+'</b></div>'+
    '<div class="loot-row"><span>🪙 Złoto</span><b>+'+gold+'</b></div>'+
    (gems?'<div class="loot-row"><span>💎 Kryształy</span><b>+'+gems+'</b></div>':'')+
    '</div>'+
    '<p class="muted" style="font-size:12.5px;margin-top:9px">Odłamki wydasz na relikty w panelu Postaci.</p>'+
    '<div class="row"><button class="btn" data-close="1">Odbierz</button></div>');
  d.querySelector('[data-close]').onclick = function(){ d.remove(); render(); };
}
function quitDungeon(){
  if(!DG) return;
  DG.endAt = Date.now();
  endDungeon();
}
function renderDungeon(){
  const layer = document.getElementById('layer-dungeon');
  if(!DG || !state.dungeon){ layer.hidden = true; layer.innerHTML = ''; return; }
  layer.hidden = false;
  const left = Math.max(0, DG.endAt - Date.now());
  const pct = left/DG_TIME*100;
  let cells = '';
  for(let y=0;y<DG_H;y++){
    for(let x=0;x<DG_W;x++){
      const wall = DG.grid[y][x];
      let inner = '';
      const it = DG.items.find(i=>i.x===x&&i.y===y);
      const gh = DG.ghosts.find(g=>g.x===x&&g.y===y);
      const isP = DG.player.x===x && DG.player.y===y;
      if(isP) inner = '<span class="dg-p">🧙</span>';
      else if(gh) inner = '<span class="dg-g">👻</span>';
      else if(it) inner = '<span class="dg-i">'+it.icon+'</span>';
      cells += '<div class="dg-c'+(wall?' w':'')+'">'+inner+'</div>';
    }
  }
  layer.innerHTML =
    '<div class="dg-hud">'+
      '<div class="dg-time"><b>'+(left/1000).toFixed(1)+' s</b>'+
        '<div class="hbar" style="height:11px;margin-top:4px"><i class="en" style="width:'+pct+'%"></i></div></div>'+
      '<div class="dg-bag"><span>🔮 '+DG.bag.shard+'</span><span>🪙 '+DG.bag.gold+'</span><span>💎 '+DG.bag.gems+'</span></div>'+
      '<button class="flee" data-action="dgquit">Wyjdź</button>'+
    '</div>'+
    '<div class="dg-wrap'+(DG.flash?' hit':'')+'"><div class="dg-grid" style="grid-template-columns:repeat('+DG_W+',1fr)">'+cells+'</div></div>'+
    '<div class="dg-pad">'+
      '<button class="dg-b" data-dg="0,-1">▲</button>'+
      '<div class="dg-mid"><button class="dg-b" data-dg="-1,0">◀</button>'+
      '<button class="dg-b" data-dg="1,0">▶</button></div>'+
      '<button class="dg-b" data-dg="0,1">▼</button>'+
    '</div>'+
    '<div class="dg-tip">Strzałki / WASD albo panel poniżej. Omijaj 👻 — kradną czas i odłamki.</div>';
}
function initDungeonControls(){
  const KEYS = {ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0],
    w:[0,-1], s:[0,1], a:[-1,0], d:[1,0], W:[0,-1], S:[0,1], A:[-1,0], D:[1,0]};
  document.addEventListener('keydown', function(e){
    if(!DG || !state.dungeon) return;
    const k = KEYS[e.key];
    if(!k) return;
    e.preventDefault();
    dgMove(k[0], k[1]);
  });
  function startHold(dx,dy){
    dgMove(dx,dy);
    stopHold();
    dgHeldT = setTimeout(function(){ dgHeld = setInterval(function(){ dgMove(dx,dy); }, 130); }, 260);
  }
  function stopHold(){
    if(dgHeld){ clearInterval(dgHeld); dgHeld = null; }
    if(dgHeldT){ clearTimeout(dgHeldT); dgHeldT = null; }
  }
  document.addEventListener('pointerdown', function(e){
    const b = e.target.closest && e.target.closest('[data-dg]');
    if(!b || !DG) return;
    e.preventDefault();
    const p = b.dataset.dg.split(',');
    startHold(parseInt(p[0],10), parseInt(p[1],10));
  });
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){
    document.addEventListener(ev, stopHold);
  });
  /* przesunięcie palcem po planszy */
  let sx=0, sy=0, on=false;
  document.addEventListener('pointerdown', function(e){
    if(!DG || !e.target.closest || !e.target.closest('.dg-wrap')) return;
    on = true; sx = e.clientX; sy = e.clientY;
  });
  document.addEventListener('pointermove', function(e){
    if(!on || !DG) return;
    const dx = e.clientX-sx, dy = e.clientY-sy;
    if(Math.abs(dx) < 26 && Math.abs(dy) < 26) return;
    if(Math.abs(dx) > Math.abs(dy)) dgMove(dx>0?1:-1, 0); else dgMove(0, dy>0?1:-1);
    sx = e.clientX; sy = e.clientY;
  });
  document.addEventListener('pointerup', function(){ on = false; });
}

/* =====================================================================
   6. SCENE RENDERERS
===================================================================== */
function mkRnd(seed){
  let s = seed;
  return function(){ s = (s*9301 + 49297) % 233280; return s/233280; };
}
/* one continuous landmass that runs past the edges of the screen */
function groundPlane(x0, y0, size, base, seed, count){
  let o = isoDiamond(x0, y0, size, size, 0, base);
  const rnd = mkRnd(seed||11);
  for(let i=0;i<(count||120);i++){
    const px = x0 + rnd()*size, py = y0 + rnd()*size, w = 1.1 + rnd()*2.8, r = rnd();
    o += isoDiamond(px, py, w, w, 0.002, shade(base, r>0.5 ? 0.06 : -0.07));
  }
  for(let i=0;i<(count||120)/5;i++){
    const px = x0 + rnd()*size, py = y0 + rnd()*size;
    o += isoDiamond(px, py, 0.5+rnd()*0.7, 0.5+rnd()*0.7, 0.003, shade(base, 0.14));
  }
  return o;
}
function svgWrap(viewBox, inner){
  return '<div class="iso-stage"><svg viewBox="'+viewBox+'" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">'+inner+'</svg></div>';
}
const DECOR = [
  {t:'tree',x:-0.3,y:2.4,s:.95},{t:'tree',x:-0.35,y:7.6,s:.9},{t:'tree',x:-0.3,y:11.4,s:.95},
  {t:'bush',x:-0.3,y:5.4,s:.85},{t:'rock',x:-0.35,y:9.6,s:.85},
  {t:'tree',x:2.6,y:-0.4,s:.95},{t:'bush',x:6.4,y:-0.35,s:.85},{t:'tree',x:8.2,y:-0.4,s:.9},
  {t:'rock',x:11.6,y:-0.35,s:.85},{t:'tree',x:14.6,y:-0.35,s:.9},
  {t:'tree',x:15.5,y:2.6,s:.95},{t:'bush',x:15.5,y:7.2,s:.85},{t:'tree',x:15.55,y:11.5,s:.9},
  {t:'rock',x:15.5,y:6.0,s:.8},{t:'tree',x:2.5,y:15.5,s:.95},{t:'bush',x:6.6,y:15.5,s:.85},
  {t:'tree',x:8.4,y:15.5,s:.9},{t:'rock',x:11.8,y:15.5,s:.85},{t:'tree',x:14.8,y:15.4,s:.9},
  {t:'bush',x:6.4,y:3.6,s:.8},{t:'rock',x:9.9,y:4.2,s:.75},{t:'bush',x:3.9,y:9.4,s:.8},
  {t:'rock',x:6.3,y:11.9,s:.75},{t:'bush',x:10.2,y:9.6,s:.8},
];
function decorSVG(d){
  if(d.t==='tree') return propTree(d.x,d.y,0,d.s);
  if(d.t==='bush') return propBush(d.x,d.y,0,d.s);
  return propRock(d.x,d.y,0,d.s);
}
function levelBadge(x,y,z,lvl){
  const p = iso(x,y,z);
  return '<g><circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="12" fill="#2a1e13" stroke="#ffce54" stroke-width="2.5"/>'+
    '<text x="'+p[0].toFixed(1)+'" y="'+(p[1]+4.5).toFixed(1)+'" text-anchor="middle" font-family="Baloo 2,sans-serif" font-size="13" font-weight="800" fill="#ffce54">'+lvl+'</text></g>';
}
function scaledModel(pl, lvl){
  const k = plotScale(pl), a = iso(pl.x, pl.y, 0);
  return '<g transform="translate('+a[0].toFixed(1)+','+a[1].toFixed(1)+') scale('+k.toFixed(3)+
    ') translate('+(-a[0]).toFixed(1)+','+(-a[1]).toFixed(1)+')">'+BUILDING_MODELS[pl.id](pl.x, pl.y, lvl)+'</g>';
}
function renderCastle(){
  const layer = document.getElementById('layer-castle');
  const draw = [];
  let base = groundPlane(-17, -17, LAND+34, '#5f9440', 13, 150);
  /* outer woodland so the land never reads as empty */
  const wr = mkRnd(29);
  for(let i=0;i<46;i++){
    const px = -15 + wr()*(LAND+30), py = -15 + wr()*(LAND+30);
    if(px > -2.2 && px < LAND+2.2 && py > -2.2 && py < LAND+2.2) continue;
    base += (wr() > 0.25 ? propTree(px, py, 0, 0.8+wr()*0.4, wr()>0.6) : propRock(px, py, 0, 0.7+wr()*0.3));
  }
  base += isoBox(-0.9,-0.9,0,LAND+1.8,LAND+1.8,0.14,'#84c65d');
  const road = 'rgba(214,192,146,.9)';
  let estate = '';
  [3.0, 7.35, 11.7].forEach(function(v){
    estate += isoDiamond(0.15, v, LAND-0.3, 0.85, 0.012, road);
    estate += isoDiamond(v, 0.15, 0.85, LAND-0.3, 0.012, road);
  });
  DECOR.forEach(d=>draw.push({k:d.x+d.y, s:decorSVG(d)}));
  PLOTS.forEach(pl=>{
    const lvl = bLvl(pl.id), cx = pl.x+pl.s/2, cy = pl.y+pl.s/2;
    let g = '';
    if(pl.soon){
      g += emptyPlot(pl.x,pl.y,pl.s,SOON[pl.id]);
      g += label(cx, cy, -0.9, SOON[pl.id].name, '#e8dcc0', 13);
    } else if(lvl > 0){
      g += isoDiamond(pl.x-0.1,pl.y-0.1,pl.s+0.2,pl.s+0.2,0.012,'rgba(198,178,134,.8)');
      g += scaledModel(pl, lvl);
      g += levelBadge(pl.x+pl.s*0.92, pl.y+0.1, 1.05, lvl);
      g += label(cx, cy, -0.55, BUILDINGS[pl.id].name, '#fff6e2', 13);
      if(pl.id==='sawmill' && (sawPending('wood')+sawPending('stone'))>0){
        const p = iso(cx, cy, 1.75);
        g += '<g class="coin-ready"><circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="15" fill="#2a1e13" stroke="#ffce54" stroke-width="2.5"/>'+
             '<text x="'+p[0].toFixed(1)+'" y="'+(p[1]+6).toFixed(1)+'" text-anchor="middle" font-size="15">🪵</text></g>';
      }
      if(pl.id==='mine' && minePending()>0){
        const p = iso(cx, cy, 1.75);
        g += '<g class="coin-ready"><circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="15" fill="#2a1e13" stroke="#ffce54" stroke-width="2.5"/>'+
             '<text x="'+p[0].toFixed(1)+'" y="'+(p[1]+6).toFixed(1)+'" text-anchor="middle" font-size="16">💰</text></g>';
      }
    } else {
      g += emptyPlot(pl.x,pl.y,pl.s,null);
      g += label(cx, cy, -0.55, BUILDINGS[pl.id].name, '#ffe9b8', 13);
      g += label(cx, cy, -0.9, bcost(pl.id,1)+' złota', '#d8c6a4', 11.5);
    }
    draw.push({k:pl.x+pl.y+pl.s/2, s:'<g class="clickable" data-action="plot" data-id="'+pl.id+'">'+g+'</g>'});
  });
  draw.sort((a,b)=>a.k-b.k);
  layer.innerHTML = svgWrap('-480 -150 960 690',
    base + '<g transform="translate(0,'+(-0.14*TZ).toFixed(2)+')">' + estate + draw.map(d=>d.s).join('') + '</g>');
}

/* ---------- world map ---------- */
function landDecor(z){
  const i = z.isl, x = i.x, y = i.y, w = i.w;
  let o = '';
  if(z.land==='meadow'){
    o += propTree(x+0.7,y+0.8,0,.95) + propTree(x+3.6,y+3.4,0,.85) + propBush(x+3.3,y+0.9,0,1);
    o += isoCyl(x+1.1,y+3.3,0,0.1,0.7,'#7a5433') + isoBox(x+0.8,y+3.25,0.6,0.62,0.1,0.34,'#a97a45');
    o += propBush(x+2.2,y+3.7,0,.8);
  } else if(z.land==='forest'){
    o += propTree(x+0.8,y+0.9,0,1.05,true)+propTree(x+2.6,y+0.7,0,.85,true)+propTree(x+3.5,y+2.6,0,1,true)+
         propTree(x+1.0,y+3.3,0,.9,true)+propTree(x+2.3,y+2.2,0,.75,true);
  } else if(z.land==='cave'){
    o += isoBox(x+1.0,y+0.7,0,2.2,2.4,1.35,'#8d949c');
    o += isoBox(x+1.35,y+1.0,1.35,1.4,1.6,0.6,'#9aa1a9');
    o += faceY(x+1.6,x+2.6,y+3.1,0,1.0,'#191c22');
    o += poly([iso(x+1.6,y+3.1,1.0),iso(x+2.6,y+3.1,1.0),iso(x+2.1,y+3.1,1.32)],'#191c22');
    o += propRock(x+0.5,y+3.4,0,.9)+propRock(x+3.5,y+0.6,0,.8);
  } else if(z.land==='swamp'){
    o += '<ellipse cx="'+iso(x+2.1,y+2.2,0.02)[0].toFixed(1)+'" cy="'+iso(x+2.1,y+2.2,0.02)[1].toFixed(1)+
         '" rx="46" ry="23" fill="#3f4f35"/>';
    o += '<ellipse cx="'+iso(x+2.1,y+2.2,0.02)[0].toFixed(1)+'" cy="'+(iso(x+2.1,y+2.2,0.02)[1]-3).toFixed(1)+
         '" rx="30" ry="14" fill="#5c7a4a" opacity=".65"/>';
    o += isoCyl(x+0.9,y+0.8,0,0.16,1.25,'#4e4130')+isoCyl(x+3.4,y+3.2,0,0.14,1.0,'#4e4130');
    o += propBush(x+3.5,y+0.8,0,.8);
  } else if(z.land==='waste'){
    o += propRock(x+0.7,y+0.8,0,1.0) + propRock(x+3.3,y+3.2,0,.85);
    o += isoCyl(x+1.6,y+1.6,0,0.5,0.35,'#5e2a10');
    o += '<ellipse cx="'+iso(x+1.85,y+1.85,0.35)[0].toFixed(1)+'" cy="'+iso(x+1.85,y+1.85,0.35)[1].toFixed(1)+
         '" rx="20" ry="10" fill="#ff8a3c" opacity=".75" class="pulse"/>';
    o += isoCyl(x+3.2,y+0.9,0,0.12,0.9,'#3a2418') + isoCyl(x+0.8,y+3.3,0,0.1,0.7,'#3a2418');
  } else if(z.land==='ice'){
    o += isoCone(x+1.0,y+1.0,0,0.6,1.5,'#d6f2ff') + isoCone(x+3.2,y+2.6,0,0.5,1.2,'#bfe6f7');
    o += isoCone(x+2.2,y+3.4,0,0.4,0.9,'#eafaff');
    o += isoDiamond(x+1.7,y+1.7,1.4,1.4,0.17,'#9fd8ef');
  } else if(z.land==='void'){
    const c = iso(x+2.1,y+2.2,0.3);
    o += '<ellipse cx="'+c[0].toFixed(1)+'" cy="'+c[1].toFixed(1)+'" rx="44" ry="22" fill="#1a0f33"/>';
    o += '<ellipse cx="'+c[0].toFixed(1)+'" cy="'+(c[1]-3).toFixed(1)+'" rx="28" ry="14" fill="#6f42b0" opacity=".7" class="pulse"/>';
    o += isoCyl(x+0.7,y+0.8,0,0.14,1.3,'#3d2a5e') + isoCyl(x+3.4,y+3.3,0,0.14,1.1,'#3d2a5e');
    o += propRock(x+3.4,y+0.7,0,.8);
  } else {
    o += isoBox(x+0.9,y+1.2,0,0.45,0.45,1.5,'#8b8494');
    o += isoBox(x+2.9,y+1.2,0,0.45,0.45,1.5,'#8b8494');
    o += isoBox(x+0.9,y+1.2,1.5,2.45,0.45,0.35,'#9e97ab');
    o += faceY(x+1.45,x+2.75,y+1.62,0,1.45,'#221d2c');
    o += isoBox(x+1.2,y+3.2,0,0.5,0.2,0.6,'#8b8494');
    o += isoBox(x+2.6,y+3.5,0,0.45,0.2,0.5,'#8b8494');
    o += propRock(x+3.4,y+2.6,0,.8);
  }
  return o;
}
function renderWorld(){
  const layer = document.getElementById('layer-world');
  const centers = {};
  ZONES.forEach(z=>{ centers[z.id] = iso(z.isl.x+z.isl.w/2, z.isl.y+z.isl.d/2, 0); });
  let paths = groundPlane(-20, -20, 56, '#5d8f3e', 41, 170);
  const wr = mkRnd(67);
  for(let i=0;i<70;i++){
    const px = -22 + wr()*60, py = -22 + wr()*60;
    let near = false;
    ZONES.concat(NODES).forEach(z=>{
      if(px > z.isl.x-3 && px < z.isl.x+z.isl.w+3 && py > z.isl.y-3 && py < z.isl.y+z.isl.d+3) near = true;
    });
    if(near) continue;
    paths += (wr() > 0.3 ? propTree(px, py, 0, 0.75+wr()*0.45, wr()>0.5) : propRock(px, py, 0, 0.7+wr()*0.3));
  }
  function trail(a, b, w){
    return '<path d="M'+P(a)+' Q'+((a[0]+b[0])/2).toFixed(1)+','+((a[1]+b[1])/2-46).toFixed(1)+' '+P(b)+
      '" fill="none" stroke="rgba(226,204,158,.95)" stroke-width="'+w+'" stroke-linecap="round"/>'+
      '<path d="M'+P(a)+' Q'+((a[0]+b[0])/2).toFixed(1)+','+((a[1]+b[1])/2-46).toFixed(1)+' '+P(b)+
      '" fill="none" stroke="rgba(255,246,226,.6)" stroke-width="'+Math.max(3,w/3.6)+'" stroke-linecap="round" stroke-dasharray="2 16"/>';
  }
  for(let i=0;i<ZONES.length-1;i++) paths += trail(centers[ZONES[i].id], centers[ZONES[i+1].id], 15);
  NODES.forEach(function(nd){
    if(!nd.near || !centers[nd.near]) return;
    paths += trail(centers[nd.near], iso(nd.isl.x+nd.isl.w/2, nd.isl.y+nd.isl.d/2, 0), 10);
  });
  const draw = [];
  let highest = ZONES[0];
  ZONES.forEach(z=>{ if(state.level >= z.unlockLevel) highest = z; });
  ZONES.forEach(z=>{
    const locked = state.level < z.unlockLevel, i = z.isl;
    let g = isoBox(i.x, i.y, 0, i.w, i.d, 0.16, z.grass);
    g += isoDiamond(i.x+0.3, i.y+0.3, i.w-0.6, i.d-0.6, 0.165, shade(z.grass, 0.07));
    g += landDecor(z);
    if(z.id === highest.id){
      const hp = iso(i.x+i.w/2-1.2, i.y+i.d/2+1.1, 0);
      g += '<g transform="translate('+(hp[0]-26).toFixed(1)+','+(hp[1]-52).toFixed(1)+')">'+
           '<svg width="52" height="52" viewBox="0 0 100 100">'+CREATURES.hero({}, 'h'+(uidSeq++))+'</svg></g>';
    }
    g += label(i.x+i.w/2, i.y+i.d/2, 2.25, z.name, locked?'#c9bda6':'#fff6e2', 15);
    g += label(i.x+i.w/2, i.y+i.d/2, 1.9, locked ? ('🔒 wymaga poz. '+z.unlockLevel) : ('poz. '+MONSTERS[z.monsters[0]].level+'–'+MONSTERS[z.boss].level+' • '+zoneCost(z)+' ⚡'),
        locked?'#c9bda6':'#ffe9b8', 11.5);
    const wrap = locked
      ? '<g style="filter:grayscale(.75) brightness(.78)" data-action="zone" data-id="'+z.id+'">'+g+'</g>'
      : '<g class="clickable" data-action="zone" data-id="'+z.id+'">'+g+'</g>';
    draw.push({k:i.x+i.y, s:wrap});
  });
  NODES.forEach(function(nd){
    const st = nodeState(nd.id), i = nd.isl, lvl = st.lvl||0;
    let g = '';
    /* surroundings that say what the node harvests */
    const sr = mkRnd(nd.res === 'wood' ? 91 : 137);
    for(let t=0;t<16;t++){
      const px = i.x - 2.6 + sr()*(i.w + 5.2), py = i.y - 2.6 + sr()*(i.d + 5.2);
      if(px > i.x-0.6 && px < i.x+i.w+0.6 && py > i.y-0.6 && py < i.y+i.d+0.6) continue;
      g += nd.res === 'wood' ? propTree(px, py, 0, 0.85+sr()*0.35, true) : propRock(px, py, 0, 0.75+sr()*0.45);
    }
    g += isoBox(i.x, i.y, 0, i.w, i.d, 0.16, nd.grass);
    g += isoDiamond(i.x+0.3, i.y+0.3, i.w-0.6, i.d-0.6, 0.165, shade(nd.grass, 0.08));
    if(nd.res === 'wood'){
      g += propTree(i.x+0.8, i.y+0.8, 0.16, 0.9, true) + propTree(i.x+2.3, i.y+1.0, 0.16, 0.75, true);
      g += isoCyl(i.x+1.0, i.y+2.2, 0.16, 0.22, 0.26, '#8a5a34') + isoCyl(i.x+1.0, i.y+2.2, 0.42, 0.22, 0.26, '#9c6a3e');
      g += isoBox(i.x+1.7, i.y+2.1, 0.16, 0.5, 0.4, 0.3, '#a97a45');
    } else {
      g += isoBox(i.x+0.8, i.y+0.7, 0.16, 1.3, 1.4, 0.85, '#8d949c');
      g += isoBox(i.x+1.1, i.y+1.0, 1.01, 0.7, 0.8, 0.4, '#9aa1a9');
      g += faceY(i.x+1.1, i.x+1.8, i.y+2.1, 0.16, 0.75, '#191c22');
      g += propRock(i.x+2.2, i.y+2.1, 0.16, 0.85) + propRock(i.x+0.5, i.y+2.3, 0.16, 0.7);
    }
    g += label(i.x+i.w/2, i.y+i.d/2, 2.1, nd.icon+' '+nd.name, '#fff6e2', 14);
    g += label(i.x+i.w/2, i.y+i.d/2, 1.78, lvl>0 ? ('poz. '+lvl+' • '+nodeRate(nd,lvl)+'/h') : 'strzeżone — pokonaj strażnika', '#ffe9b8', 11.5);
    if(nodePending(nd.id) > 0){
      const p = iso(i.x+i.w/2, i.y+i.d/2, 1.4);
      g += '<g class="coin-ready"><circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="15" fill="#2a1e13" stroke="#ffce54" stroke-width="2.5"/>'+
           '<text x="'+p[0].toFixed(1)+'" y="'+(p[1]+6).toFixed(1)+'" text-anchor="middle" font-size="15">'+nd.icon+'</text></g>';
    }
    draw.push({k:i.x+i.y, s:'<g class="clickable" data-action="node" data-id="'+nd.id+'">'+g+'</g>'});
  });
  /* --- Wędrowny Heros --- */
  const hs = state.heroSpawn;
  if(hs && hs.alive){
    const spot = HERO_SPOTS[hs.spot % HERO_SPOTS.length];
    const hm = heroMonster();
    const c = iso(spot.x, spot.y, 0);
    let g = '<ellipse cx="'+c[0].toFixed(1)+'" cy="'+c[1].toFixed(1)+'" rx="34" ry="17" fill="#ffce54" opacity=".28" class="pulse"/>';
    g += '<g transform="translate('+(c[0]-33).toFixed(1)+','+(c[1]-74).toFixed(1)+')">'+
         '<svg width="66" height="66" viewBox="0 0 100 100">'+CREATURES.hero({}, 'wh'+(uidSeq++))+'</svg></g>';
    g += label(spot.x, spot.y, 3.35, '🦸 Wędrowny Heros', '#ffe9b8', 14);
    g += label(spot.x, spot.y, 3.0, heroSubLabel(), '#fff6e2', 11.5, 'heroTimer');
    draw.push({k:spot.x+spot.y+0.01, s:'<g class="clickable" data-action="hero">'+g+'</g>'});
  }
  draw.sort((a,b)=>a.k-b.k);
  layer.innerHTML = svgWrap('-500 -120 900 640', paths + draw.map(d=>d.s).join(''));
}

/* ---------- battle ---------- */
function renderBattle(){
  const layer = document.getElementById('layer-battle');
  const b = state.battle;
  if(!b){ layer.hidden = true; layer.innerHTML=''; return; }
  const m = b.monster;
  let bgStyle, arenaName;
  if(b.guard){
    const nd = NODES.find(n=>n.id===b.guard);
    arenaName = (nd ? nd.icon+' '+nd.name : 'Złoże');
    bgStyle = nd && nd.res === 'stone'
      ? 'linear-gradient(180deg,#a9b0b8 0%,#6c757e 46%,#2f353c 100%)'
      : 'linear-gradient(180deg,#b7cfa0 0%,#5f8a4a 46%,#2a3f22 100%)';
  } else {
    const z = ZONES.find(x=>x.id===b.zoneId);
    arenaName = z ? z.name : 'Pojedynek';
    bgStyle = z ? z.bg : 'linear-gradient(180deg,#9fb2d4 0%,#5b6f9c 46%,#28324f 100%)';
  }
  layer.hidden = false;
  const arena = b.zoneId && ART_OK['arena:'+b.zoneId];
  if(arena){
    layer.style.background = 'url("'+arena+'") center bottom / cover no-repeat';
    layer.classList.add('has-art');

    layer.style.background = bgStyle;
    layer.classList.remove('has-art');
